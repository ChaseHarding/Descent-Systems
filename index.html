<style>
/* Layout: one full-height stage — canvas fills it, instrument HUD pinned top-left, touch pad below on phones.
   Each world brings its own sky/ground colors into the canvas; the HUD chrome stays constant. */
:root {
  --space: #0a0e1c;
  --space-2: #121a33;
  --regolith: #c9cfdc;
  --regolith-dim: #6c7690;
  --flame: #ffb547;
  --ok: #9fe0b8;
  --warn: #ffb547;
  --bad: #ff6b5e;
  --panel: rgba(10, 14, 28, 0.78);
  --f-display: "Chakra Petch", "Trebuchet MS", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--space);
  color: var(--regolith);
  font-family: var(--f-mono);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  touch-action: none;
}
.app {
  height: 100%;
  display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(12px, env(safe-area-inset-top, 0px));
  padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
  gap: 10px;
  box-sizing: border-box;
}
.stage {
  position: relative; flex: 1; min-height: 0;
  border: 1px solid var(--space-2);
  border-radius: 6px;
  overflow: hidden;
  background: var(--space);
}
canvas { display: block; width: 100%; height: 100%; }

.hud {
  position: absolute; top: 10px; left: 10px;
  display: grid; grid-template-columns: auto auto; column-gap: 14px; row-gap: 2px;
  padding: 10px 12px; margin: 0;
  background: var(--panel);
  border: 1px solid var(--space-2);
  border-radius: 4px;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  pointer-events: none;
}
.hud .row { display: contents; }
.hud dt { color: var(--regolith-dim); letter-spacing: 0.08em; }
.hud dd { margin: 0; text-align: right; min-width: 7ch; }
.hud dd.ok { color: var(--ok); }
.hud dd.warn { color: var(--warn); }
.hud dd.bad { color: var(--bad); }
.fuel { grid-column: 1 / -1; height: 5px; background: var(--space-2); margin-top: 6px; border-radius: 2px; overflow: hidden; }
.fuel i { display: block; height: 100%; background: var(--flame); width: 100%; }

.score {
  position: absolute; top: 10px; right: 10px;
  text-align: right; font-size: 12px; pointer-events: none;
  font-variant-numeric: tabular-nums;
  padding: 6px 10px; background: var(--panel); border-radius: 4px;
}
.score b { display: block; font-family: var(--f-display); font-size: 22px; font-weight: 700; color: var(--regolith); }
.score span { color: var(--regolith-dim); letter-spacing: 0.08em; }

.overlay {
  position: absolute; inset: 0;
  display: flex;
  background: rgba(10, 14, 28, 0.6);
  padding: 16px;
  overflow-y: auto;
}
.card {
  max-width: 40rem; width: 100%; margin: auto; text-align: center;
  display: flex; flex-direction: column; gap: 12px; align-items: center;
}
.card h1 {
  font-family: var(--f-display); font-weight: 700;
  font-size: clamp(28px, 6vw, 52px); letter-spacing: 0.04em;
  margin: 0; text-wrap: balance; text-transform: uppercase; line-height: 1.05;
}
.card h1.bad { color: var(--bad); }
.card h1.good { color: var(--flame); }
.card p { margin: 0; line-height: 1.6; font-size: 13px; color: var(--regolith); text-wrap: pretty; }
.card .limits { color: var(--regolith-dim); font-size: 12px; }
kbd {
  font-family: var(--f-mono); font-size: 11px;
  border: 1px solid var(--regolith-dim); border-radius: 3px; padding: 1px 5px;
}
.btn {
  font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--space); background: var(--flame);
  border: 0; border-radius: 4px; padding: 10px 22px; cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--regolith); border: 1px solid var(--regolith-dim); }
.btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.btn:focus-visible, .pad button:focus-visible, .world:focus-visible { outline: 2px solid var(--regolith); outline-offset: 3px; }

/* World picker */
.worlds { width: 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 96px)); justify-content: center; gap: 8px; }
.world {
  width: 100%; box-sizing: border-box; min-width: 0; padding: 10px 6px 8px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  background: var(--panel); color: var(--regolith);
  border: 1px solid var(--space-2); border-radius: 6px; cursor: pointer;
  font-family: var(--f-mono); font-size: 11px;
}
.world .orb { width: 30px; height: 30px; border-radius: 50%; box-shadow: inset -6px -5px 0 rgba(0,0,0,0.35); }
.world b { font-family: var(--f-display); font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase; }
.world span { color: var(--regolith-dim); font-variant-numeric: tabular-nums; }
.world[aria-pressed="true"] { border-color: var(--flame); }
.world[aria-pressed="true"] b { color: var(--flame); }
.brief {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px;
  font-size: 12px; color: var(--regolith-dim); font-variant-numeric: tabular-nums;
}
.brief b { color: var(--regolith); font-weight: 500; }

/* Hangar */
.card .balance { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: 0.08em; color: var(--flame); font-variant-numeric: tabular-nums; }
.preview { display: block; width: 100%; max-width: 320px; aspect-ratio: 3 / 2; border: 1px solid var(--space-2); border-radius: 6px; }
.deal { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: center; font-size: 13px; }
.deal span { color: var(--regolith-dim); }
.deal b { color: var(--regolith); font-weight: 500; }
.shelf { width: 100%; display: flex; flex-direction: column; gap: 6px; }
.shelf h2 { margin: 0; font-family: var(--f-display); font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--regolith-dim); text-align: left; }
.items { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.item {
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0;
  padding: 8px; background: var(--panel); color: var(--regolith);
  border: 1px solid var(--space-2); border-radius: 6px; cursor: pointer;
  font-family: var(--f-mono); font-size: 11px; text-align: left;
}
.item .sw { display: block; width: 100%; height: 12px; border-radius: 3px; }
.item b { font-weight: 500; font-size: 12px; }
.item span { color: var(--regolith-dim); font-variant-numeric: tabular-nums; }
.item.owned span { color: var(--regolith); }
.item.equipped span { color: var(--ok); }
.item[aria-pressed="true"] { border-color: var(--flame); }
.item:focus-visible { outline: 2px solid var(--regolith); outline-offset: 2px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
/* Game mode + hot-seat */
.seg { display: inline-flex; border: 1px solid var(--regolith-dim); border-radius: 6px; overflow: hidden; }
.seg button {
  font-family: var(--f-display); font-weight: 700; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 8px 14px; background: transparent; color: var(--regolith-dim); border: 0; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--regolith); color: var(--space); }
.seg button:focus-visible { outline: 2px solid var(--flame); outline-offset: -2px; }
.names { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.names label { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--regolith-dim); }
.names input {
  width: 10rem; max-width: 60vw; box-sizing: border-box;
  font-family: var(--f-mono); font-size: 13px; padding: 7px 9px;
  background: var(--panel); color: var(--regolith);
  border: 1px solid var(--space-2); border-radius: 4px;
  -webkit-user-select: text; user-select: text;
}
.names input:focus-visible { outline: 2px solid var(--flame); outline-offset: 1px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.tally-wrap { max-width: 100%; overflow-x: auto; }
.tally { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; min-width: 16rem; }
.tally th, .tally td { padding: 5px 12px; text-align: right; border-bottom: 1px solid var(--space-2); }
.tally th { font-weight: 500; }
.tally th:first-child, .tally td:first-child { text-align: left; color: var(--regolith-dim); }
.tally tfoot td { font-weight: 500; color: var(--regolith); border-bottom: 0; }
.tally .crash { color: var(--bad); }
.corner {
  position: absolute; z-index: 6;
  right: 10px; bottom: 10px;
  display: flex; gap: 6px;
}
.mute {
  font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 6px 10px; cursor: pointer;
  background: var(--panel); color: var(--regolith);
  border: 1px solid var(--space-2); border-radius: 4px;
}
.mute[aria-pressed="true"] { color: var(--regolith-dim); }
.mute:focus-visible { outline: 2px solid var(--regolith); outline-offset: 2px; }
/* Daily challenge */
.daily {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 12px 18px; background: var(--panel);
  border: 1px solid var(--flame); border-radius: 6px;
  font-size: 12px; color: var(--regolith-dim); max-width: 30rem;
}
.daily .eyebrow { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
.daily > b { font-family: var(--f-display); font-size: 24px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--flame); }
.daily span b { color: var(--regolith); font-weight: 500; }
.card .squares { font-size: 26px; letter-spacing: 0.15em; line-height: 1.2; color: var(--flame); }
.share-text {
  width: min(24rem, 100%); box-sizing: border-box; resize: none;
  font-family: var(--f-mono); font-size: 12px; padding: 8px;
  background: var(--panel); color: var(--regolith); border: 1px solid var(--space-2); border-radius: 4px;
  -webkit-user-select: text; user-select: text;
}
/* Badges */
.badges { width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 560px) { .badges { grid-template-columns: minmax(0, 1fr); } }
.badge {
  display: flex; gap: 12px; align-items: flex-start; min-width: 0;
  padding: 10px 12px; text-align: left;
  background: var(--panel); border: 1px solid var(--space-2); border-radius: 6px;
}
.badge > div { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
.badge b { font-family: var(--f-display); font-size: 14px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--regolith-dim); }
.badge span { font-size: 11px; color: var(--regolith-dim); line-height: 1.45; }
.badge .reward { color: var(--regolith); }
.badge.got { border-color: var(--flame); }
.badge.got b { color: var(--flame); }
.badge.got span { color: var(--regolith); }
.badge.got .reward { color: var(--ok); }
.medal {
  flex: none; width: 26px; height: 26px; margin-top: 2px; border-radius: 50%;
  border: 2px solid var(--regolith-dim); box-sizing: border-box;
}
.badge.got .medal { border-color: var(--flame); background: radial-gradient(circle, var(--flame) 45%, transparent 50%); }
.bar { display: block; height: 4px; margin-top: 3px; background: var(--space-2); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--flame); }
.card .sub { color: var(--regolith-dim); }
.achv {
  position: absolute; z-index: 7; left: 50%; top: 12px; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 16px; min-width: 14rem; max-width: calc(100% - 32px); box-sizing: border-box;
  background: var(--space); border: 1px solid var(--flame); border-radius: 6px;
  text-align: center; pointer-events: none;
}
.achv span { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--regolith-dim); }
.achv b { font-family: var(--f-display); font-size: 17px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--flame); }
.achv small { font-size: 11px; color: var(--regolith); }
@media (prefers-reduced-motion: no-preference) {
  .achv:not([hidden]) { animation: achv-in 0.25s ease-out; }
  @keyframes achv-in { from { transform: translate(-50%, -8px); opacity: 0; } }
}
/* Missions */
.mlist { width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 560px) { .mlist { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.mtile {
  position: relative; min-width: 0;
  display: flex; flex-direction: column; align-items: flex-start; gap: 3px;
  padding: 10px; text-align: left; cursor: pointer;
  background: var(--panel); color: var(--regolith);
  border: 1px solid var(--space-2); border-radius: 6px;
  font-family: var(--f-mono);
}
.mtile:hover:not(:disabled) { border-color: var(--regolith-dim); }
.mtile:disabled { cursor: not-allowed; opacity: 0.45; }
.mtile:focus-visible { outline: 2px solid var(--regolith); outline-offset: 2px; }
.mtile .orb { position: absolute; top: 10px; right: 10px; width: 14px; height: 14px; border-radius: 50%; }
.mnum { font-size: 11px; letter-spacing: 0.1em; color: var(--regolith-dim); font-variant-numeric: tabular-nums; }
.mtile b { font-family: var(--f-display); font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase; }
.mtype { font-size: 11px; color: var(--regolith-dim); }
.mstars { font-size: 15px; letter-spacing: 0.12em; color: var(--flame); }
.mstars .off, .card .squares .off { color: var(--regolith-dim); opacity: 0.5; }
.card .eyebrow { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--regolith-dim); }
.goals { margin: 0; padding-left: 1.4em; text-align: left; font-size: 13px; line-height: 1.7; }
.starlist { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--regolith-dim); text-align: left; }
.starlist .met { color: var(--flame); }
.objective {
  position: absolute; top: 74px; right: 10px; max-width: min(46%, 22rem);
  padding: 6px 10px; background: var(--panel); border: 1px solid var(--flame); border-radius: 4px;
  font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; pointer-events: none;
}
/* Main menu */
.card h1.title { font-size: clamp(34px, 8vw, 64px); }
.card .tagline { color: var(--regolith-dim); margin-top: -4px; }
.menu { width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 480px) { .menu { grid-template-columns: minmax(0, 1fr); } }
.mode {
  min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
  padding: 14px 16px; text-align: left; cursor: pointer;
  background: var(--panel); color: var(--regolith);
  border: 1px solid var(--space-2); border-radius: 8px; font-family: var(--f-mono);
}
.mode b { font-family: var(--f-display); font-size: 18px; letter-spacing: 0.06em; text-transform: uppercase; }
.mode span { font-size: 12px; color: var(--regolith-dim); }
.mode:hover { border-color: var(--flame); }
.mode:hover b { color: var(--flame); }
.newbie {
  width: 100%; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 12px; cursor: pointer; border: 0; border-radius: 8px;
  background: var(--flame); color: var(--space); font-family: var(--f-mono);
}
.newbie b { font-family: var(--f-display); font-size: 16px; letter-spacing: 0.06em; text-transform: uppercase; }
.newbie span { font-size: 12px; }
.subnav { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 20px; }
.link {
  background: none; border: 0; padding: 6px 2px; cursor: pointer;
  color: var(--regolith); font-family: var(--f-display); font-weight: 700; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase;
}
.link span { margin-left: 4px; color: var(--regolith-dim); font-family: var(--f-mono); font-weight: 400; letter-spacing: 0; text-transform: none; }
.link:hover { color: var(--flame); }
.mode:focus-visible, .link:focus-visible, .newbie:focus-visible, .toggle:focus-visible { outline: 2px solid var(--flame); outline-offset: 2px; }
/* Settings */
.settings { width: 100%; display: flex; flex-direction: column; gap: 8px; }
.toggle {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 12px 14px; cursor: pointer; text-align: left;
  background: var(--panel); color: var(--regolith);
  border: 1px solid var(--space-2); border-radius: 6px; font-family: var(--f-mono);
}
.toggle span { display: flex; flex-direction: column; gap: 2px; }
.toggle b { font-family: var(--f-display); font-size: 15px; letter-spacing: 0.05em; text-transform: uppercase; }
.toggle small { font-size: 12px; color: var(--regolith-dim); }
.toggle i { flex: none; position: relative; width: 38px; height: 22px; border-radius: 11px; background: var(--space-2); transition: background 0.15s; }
.toggle i::after {
  content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--regolith-dim); transition: transform 0.15s, background 0.15s;
}
.toggle[aria-pressed="true"] i { background: var(--flame); }
.toggle[aria-pressed="true"] i::after { transform: translateX(16px); background: var(--space); }
@media (prefers-reduced-motion: reduce) { .toggle i, .toggle i::after { transition: none; } }
.card h2.sect { margin: 6px 0 0; font-family: var(--f-display); font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--regolith-dim); }
/* Tutorial coach */
.coach {
  flex: none;
  display: flex; flex-direction: column; gap: 2px;
  padding: 8px 14px;
  background: var(--space); border: 1px solid var(--flame); border-radius: 6px;
  text-align: center;
}
.coach span { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--regolith-dim); }
.coach b { font-family: var(--f-display); font-size: 16px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--flame); }
.coach small { font-size: 12px; line-height: 1.5; color: var(--regolith); }
.hud .hl { background: rgba(255, 181, 71, 0.22); color: var(--flame); }
/* menus hide the flight instruments */
.stage.in-menu .hud, .stage.in-menu .score, .stage.in-menu .objective { display: none; }
.toast {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 5;
  padding: 6px 12px; background: var(--space); color: var(--flame); border: 1px solid var(--space-2); border-radius: 4px;
  font-size: 12px; letter-spacing: 0.06em; pointer-events: none;
}
.pad { display: none; gap: 10px; }
.pad button {
  flex: 1; height: 64px;
  font-family: var(--f-display); font-weight: 700; font-size: 14px; letter-spacing: 0.1em;
  color: var(--regolith); background: var(--space-2);
  border: 1px solid var(--regolith-dim); border-radius: 6px;
  touch-action: none;
}
.pad button.thrust { flex: 1.6; color: var(--flame); border-color: var(--flame); }
.pad button.held { background: var(--regolith-dim); color: var(--space); }
@media (pointer: coarse) { .pad { display: flex; } .keys-hint { display: none; } }
.pad.off { display: none !important; }
@media (max-width: 520px) {
  .hud { font-size: 11px; padding: 8px 10px; }
  .score b { font-size: 18px; }
}
</style>
</head>

      turn() { tone(523, 'triangle', 0, 0.15, 0.2); tone(784, 'triangle', 0.12, 0.25, 0.2); },
      erupt(lava) { burst(0, 1.4, lava ? 0.45 : 0.25, lava ? 1400 : 4000, lava ? 120 : 900); if (lava) tone(55, 'sawtooth', 0, 0.8, 0.25, 30); },
      badge() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 'triangle', i * 0.09, 0.3, 0.18)); }
    };
  })();

  // Low-fuel alarm: slow beeps under 20 kg, fast under 10, a falling tone when the tank runs dry.
  let beepT = 0, wasEmpty = false;
  function fuelAlarm(dt) {
    if (mode !== 'flying' || !lander) { beepT = 0; wasEmpty = false; return; }
    const f = lander.fuel;
    if (f <= 0) { if (!wasEmpty) { sfx.empty(); wasEmpty = true; } return; }
    wasEmpty = false;
    if (f < 20) {
      beepT -= dt;
      if (beepT <= 0) { sfx.beep(f < 10); beepT = f < 10 ? 0.35 : 0.7; }
    } else beepT = 0;
  }

  // ---- State ----
  const keys = { left: false, right: false, thrust: false };
  let terrain = [], pads = [], stars = [], dust = [], ceilings = [], vents = [];
  let lander, particles = [];
  let mode = 'title';
  let level = 1, lives = 3, score = 0, levelFuel = 100;
  let lastResult = null;
  let simT = 0, windDir = 1, windSeed = 0, windNow = 0;

  const rand = (a, b) => a + Math.random() * (b - a);   // effects: always truly random
  // Terrain, start position and wind draw from rng, which the daily challenge seeds by date.
  let rng = Math.random;
  const rrand = (a, b) => a + rng() * (b - a);
  function mulberry32(seed) {
    return () => {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function hashStr(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  // ---- Terrain ----
  function genTerrain() {
    ceilings = []; missionTerrain = false;
    const step = 6, n = Math.round(W / step);
    const rough = (4 + level * 1.2) * world.rough;
    const h = [];
    let y = rrand(20, 50);
    for (let i = 0; i <= n; i++) {
      y += rrand(-1, 1) * rough;
      y = Math.max(6, Math.min(H * 0.5, y));
      h.push(y);
    }
    const defs = [{ len: 2, mult: 5 }, { len: 3, mult: 3 }, { len: 5, mult: 2 }];
    for (let i = defs.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [defs[i], defs[j]] = [defs[j], defs[i]];
    }
    pads = [];
    const third = Math.floor(n / 3);
    defs.forEach((d, k) => {
      const lo = k * third + 1, hi = (k + 1) * third - d.len - 1;
      const s = Math.floor(rrand(lo, Math.max(lo, hi)));
      const py = h[s];
      for (let i = s; i <= s + d.len; i++) h[i] = py;
      pads.push({ x1: s * step, x2: (s + d.len) * step, y: py, mult: d.mult });
    });
    terrain = h.map((y, i) => [i * step, y]);
    windDir = rng() < 0.5 ? -1 : 1;
    windSeed = rrand(0, 100);
    // geysers / volcanic vents, kept clear of the pads
    vents = [];
    if (world.hazard) {
      for (let tries = 0; vents.length < 3 && tries < 80; tries++) {
        const x = rrand(12, W - 12);
        if (pads.some(p => x > p.x1 - 9 && x < p.x2 + 9) || vents.some(v => Math.abs(v.x - x) < 25)) continue;
        const period = rrand(5, 8);
        vents.push({ x, period, phase: rrand(0, period), was: false });
      }
    }
  }
  const ERUPT = 2.2, WARN = 1.6, PLUME_H = 42;
  function ventState(v) {
    const t = (simT + v.phase) % v.period;
    if (t < ERUPT) return { on: true, k: t / ERUPT };
    if (t > v.period - WARN) return { warn: true };
    return {};
  }
  function plumeTop(v, st) {
    const k = st.k, f = k < 0.15 ? k / 0.15 : k > 0.8 ? (1 - k) / 0.2 : 1;
    return groundAt(v.x) + PLUME_H * f;
  }
  function groundAt(x) {
    const T = terrain;
    if (x <= T[0][0]) return T[0][1];
    for (let i = 0; i < T.length - 1; i++) {
      const [x0, y0] = T[i], [x1, y1] = T[i + 1];
      if (x <= x1) return x1 > x0 ? y0 + (y1 - y0) * (x - x0) / (x1 - x0) : y1;
    }
    return T[T.length - 1][1];
  }
  // Rock hanging from above (canyon roofs). Infinity where the sky is open.
  function ceilingAt(x) {
    let best = Infinity;
    for (const c of ceilings) {
      if (x < c[0][0] || x > c[c.length - 1][0]) continue;
      for (let i = 0; i < c.length - 1; i++) {
        const [x0, y0] = c[i], [x1, y1] = c[i + 1];
        if (x <= x1) { const y = x1 > x0 ? y0 + (y1 - y0) * (x - x0) / (x1 - x0) : y1; if (y < best) best = y; break; }
      }
    }
    return best;
  }
  // Gusting wind: a steady breeze plus two slow waves, occasionally reversing on stormy worlds.
  function windAt(t) {
    if (!world.wind) return 0;
    const s = t + windSeed;
    const gust = 0.55 + 0.35 * Math.sin(s * 0.45) + 0.25 * Math.sin(s * 1.6 + 1.3);
    return world.wind * windDir * gust;
  }

  // ---- Lander ----
  function spawn(plan) {
    spawnPlan = plan || { x: rrand(W * 0.2, W * 0.8), vx: rrand(-4, 4) };
    flagPlant = null;
    flightT = 0; simT = 0; recording = [];
    lander = {
      x: spawnPlan.x, y: spawnPlan.y ?? H - 12,
      vx: spawnPlan.vx, vy: spawnPlan.vy ?? 0, a: 0,
      fuel: levelFuel, fuelMax: levelFuel, firing: false,
      grounded: false, cargo: false, crew: false
    };
    particles = [];
    resetCamera();
  }
  function toWorld(lx, ly, L = lander) {
    const c = Math.cos(L.a), s = Math.sin(L.a);
    return [L.x + lx * c + ly * s, L.y - lx * s + ly * c];
  }

  // ---- Simulation ----
  function step(dt) {
    simT += dt;
    windNow = windAt(simT);
    const L = lander;
    if (mode === 'flying') {
      let rot = 0;
      if (keys.left) rot -= 1;
      if (keys.right) rot += 1;
      if (rot && L.fuel > 0 && !L.grounded) {
        const na = L.a + rot * ROT_RATE * rotMul() * dt;
        L.a = fullSpin ? Math.atan2(Math.sin(na), Math.cos(na))          // wrap to ±180°
                       : Math.max(-Math.PI / 2, Math.min(Math.PI / 2, na));
        L.fuel = Math.max(0, L.fuel - RCS_BURN * dt);
      }
      L.firing = keys.thrust && L.fuel > 0;
      let ax = windNow - world.drag * L.vx;
      let ay = -world.g - world.drag * L.vy;
      if (L.firing) {
        const T = world.thrust * thrustMul();
        ax += Math.sin(L.a) * T;
        ay += Math.cos(L.a) * T;
        L.fuel = Math.max(0, L.fuel - BURN * dt);
        if (Math.random() < 0.9) emitExhaust();
      }
      if (world.hazard === 'geyser') {
        for (const v of vents) {
          const st = ventState(v);
          if (st.on && Math.abs(L.x - v.x) < 4.5 && L.y < plumeTop(v, st) + 4) {
            ay += 9 * (1 - Math.max(0, L.y - groundAt(v.x)) / (PLUME_H + 4));
          }
        }
      }
      if (tut) {
        if (L.firing) tut.burn += dt;
        tut.t += dt;
        if (tut.step === 0 && tut.burn > 0.8) nextTut();
        else if (tut.step === 1 && Math.abs(L.a) > 0.3) nextTut();
        else if (tut.step === 2 && tut.t > 5) nextTut();
        if (tut.step < 2) { ax = 0; ay = 0; L.vx = 0; L.vy = 0; }   // training hold: gravity switches on at step 3
      }
      if (L.grounded) {
        // resting on a pad: stay put until the engine can lift you
        if (L.firing && ay > 0) { L.grounded = false; L.y += 0.05; if (mission) mission.loading = false; }
        else { ax = 0; ay = 0; L.vx = 0; L.vy = 0; }
      }
      L.vx += ax * dt; L.vy += ay * dt;
      L.x += L.vx * dt; L.y += L.vy * dt;
      if (L.x < 4) { L.x = 4; L.vx = Math.abs(L.vx) * 0.3; }
      if (L.x > W - 4) { L.x = W - 4; L.vx = -Math.abs(L.vx) * 0.3; }
      flightT += dt;
      const fi = Math.floor(flightT * 60);
      while (recording.length <= fi) recording.push([L.x, L.y, L.a, L.firing ? 1 : 0]);
      if (L.grounded && mission && mission.loading) {
        mission.loadT += dt;
        if (mission.loadT >= LOAD_TIME) finishPickup();
      }
      const goal = mission && currentGoal();
      if (goal && goal.type === 'exit' && L.y > H + 4) completeMission(null);
      else checkContact();
    }
    for (const p of particles) {
      p.vy -= (p.g ?? 0) * dt;
      p.vx += windNow * 3 * dt - world.drag * 2 * p.vx * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.y < groundAt(p.x)) { p.y = groundAt(p.x); p.vy *= -0.3; p.vx *= 0.6; }
      p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);
    for (const v of vents) {
      const on = !!ventState(v).on;
      if (on && !v.was && mode === 'flying') sfx.erupt(world.hazard === 'volcano');
      v.was = on;
    }
    for (const d of dust) {
      d.x += (windNow * 9 + d.v) * dt;
      d.y += Math.sin(simT * 2 + d.ph) * 0.6 * dt;
      if (d.x > W + 5) d.x -= W + 10;
      if (d.x < -5) d.x += W + 10;
    }
  }

  function emitExhaust() {
    const L = lander;
    const [ex, ey] = toWorld(rand(-0.6, 0.6), -1.4);
    const spd = rand(10, 18);
    const dir = L.a + Math.PI + rand(-0.25, 0.25);
    particles.push({
      x: ex, y: ey,
      vx: Math.sin(dir) * spd + L.vx, vy: Math.cos(dir) * spd + L.vy,
      life: rand(0.25, 0.6), max: 0.6, kind: 'fire', hue: rand(0, 120)
    });
  }
  function explode() {
    const L = lander;
    for (let i = 0; i < 90; i++) {
      const a = rand(0, Math.PI * 2), s = rand(3, 22);
      particles.push({
        x: L.x, y: L.y + 1, vx: Math.cos(a) * s + L.vx * 0.3, vy: Math.abs(Math.sin(a)) * s,
        g: Math.max(3, world.g * 2), life: rand(0.8, 2.4), max: 2.4, kind: i % 3 ? 'blast' : 'debris'
      });
    }
  }

  function checkContact() {
    const L = lander;
    if (L.grounded) return;
    const feet = FEET.map(([x, y]) => toWorld(x, y));
    const hull = HULL.map(([x, y]) => toWorld(x, y));
    const hullHit = hull.some(([x, y]) => y <= groundAt(x));
    const footHit = feet.some(([x, y]) => y <= groundAt(x));
    const roofHit = ceilings.length > 0 && [...hull, ...feet].some(([x, y]) => y >= ceilingAt(x));
    const lavaHit = world.hazard === 'volcano' && vents.some(v => {
      const st = ventState(v);
      if (!st.on) return false;
      const top = plumeTop(v, st);
      return [...hull, ...feet].some(([x, y]) => Math.abs(x - v.x) < 3.5 && y < top);
    });
    if (!hullHit && !footHit && !roofHit && !lavaHit) return;

    const pad = pads.find(p => feet.every(([x]) => x >= p.x1 && x <= p.x2));
    const angDeg = Math.abs(L.a * 180 / Math.PI);
    const vy = -L.vy, vx = Math.abs(L.vx);
    const stats = { vy, vx, ang: angDeg };

    if (!hullHit && !roofHit && !lavaHit && pad && vy <= SAFE_VY && vx <= SAFE_VX && angDeg <= SAFE_ANG) {
      if (tut) { tutorialLanded(pad, vy, vx, angDeg); return; }
      if (mission) { missionTouchdown(pad, vy, vx, angDeg); return; }
      L.y += pad.y - Math.min(...feet.map(f => f[1]));
      L.vx = L.vy = 0; L.firing = false;
      // plant the flag beside the lander, on the pad when there's room
      const side = L.x + 5 <= pad.x2 - 0.5 ? 5 : L.x - 5 >= pad.x1 + 0.5 ? -5 : 5;
      flagPlant = { x: L.x + side, y: groundAt(L.x + side), t: performance.now() };
      const base = 50 * pad.mult;
      const fuelBonus = Math.round(L.fuel * 2);
      const soft = vy < 0.8 ? 50 : 0;
      const pts = Math.round((base + fuelBonus + soft) * world.bonus);
      credits += pts;
      saveCosmetics();
      lastResult = { pad, pts, base, fuelBonus, soft, ...stats };
      lastRun = { frames: recording, result: 'landed' };
      sfx.thud(); sfx.landed(soft > 0);
      onLanded(pad, vy, vx, angDeg, L.fuel);
      if (match) { endTurn(); return; }
      score += pts;
      if (daily) {
        daily.results.push(lastResult);
        if (daily.site >= DAILY_SITES) award('perfect');
        setMode(daily.site >= DAILY_SITES ? 'dailyEnd' : 'landed');
        return;
      }
      setMode('landed');
    } else {
      const reasons = [];
      if (hullHit && !footHit) reasons.push('hull struck terrain');
      if (lavaHit) reasons.push('caught in a volcanic eruption');
      if (roofHit) reasons.push('scraped the rock overhead');
      if (footHit && !pad) reasons.push('touched down off a pad');
      if ((footHit || hullHit) && vy > SAFE_VY) reasons.push(`descending at ${vy.toFixed(1)} m/s (limit ${SAFE_VY})`);
      if ((footHit || hullHit) && vx > SAFE_VX) reasons.push(`drifting at ${vx.toFixed(1)} m/s (limit ${SAFE_VX})`);
      if ((footHit || hullHit) && angDeg > SAFE_ANG) reasons.push(`tilted ${angDeg.toFixed(0)}° (limit ${SAFE_ANG}°)`);
      if (!reasons.length) reasons.push('hit the ground at a bad angle');
      explode();
      lastResult = { reasons, pts: 0, ...stats };
      lastRun = { frames: recording, result: 'crashed' };
      sfx.boom();
      if (tut) { setMode('tutFail'); return; }
      if (mission) { mission.result = { ok: false }; setMode('missionEnd'); return; }
      if (match) { endTurn(); return; }
      if (daily) { daily.results.push(lastResult); setMode('dailyEnd'); return; }
      lives--;
      setMode(lives > 0 ? 'crashed' : 'over');
    }
  }

  // ---- World selection ----
  function selectWorld(w) {
    world = w;
    store.set('ds-world', w.id);
    level = 1;
    genTerrain();
    makeBackdrop();
    if (mode === 'setup') setMode('setup');
  }
  const effectText = w => {
    const bits = [];
    if (w.drag >= 0.2) bits.push('thick air');
    else if (w.drag > 0) bits.push('thin air');
    if (w.wind >= 1) bits.push('strong wind');
    else if (w.wind > 0) bits.push('light wind');
    return bits.length ? bits.join(', ') : 'no atmosphere';
  };

  // ---- Screens ----
  const MENU_MODES = ['title', 'setup', 'settings', 'hangar', 'badges', 'missions', 'brief'];
  function setMode(m) {
    mode = m;
    stage.classList.toggle('in-menu', MENU_MODES.includes(m));
    $('pad').classList.toggle('off', MENU_MODES.includes(m));
    $('coach').hidden = !(tut && (m === 'flying' || m === 'paused'));
    if (!(tut && (m === 'flying' || m === 'paused'))) document.querySelectorAll('.hud .hl').forEach(el => el.classList.remove('hl'));
    $('pauseBtn').hidden = m !== 'flying';
    keys.left = keys.right = keys.thrust = false;
    document.querySelectorAll('.pad button').forEach(b => b.classList.remove('held'));
    if (m === 'flying') { overlay.hidden = true; return; }
    overlay.hidden = false;
    if (m === 'badges') { renderBadges(); return; }
    if (m === 'settings') { renderSettings(); return; }
    if (m === 'missions') { mission = null; renderMissions(); return; }
    if (m === 'hangar') {
      trying = { ...equip };
      hangarSel = { kind: 'hull', id: equip.hull };
      renderHangar();
      return;
    }
    const limits = `<p class="limits">Safe touchdown: vertical under ${SAFE_VY} m/s · horizontal under ${SAFE_VX} m/s · tilt under ${SAFE_ANG}°</p>`;
    let html = '';
    if (m === 'title') {
      match = null; ghost = null; daily = null; mission = null; tut = null; rng = Math.random;
      const w = storedWorld();
      if (missionTerrain || w !== world) { world = w; genTerrain(); makeBackdrop(); }
    }
    if (m === 'title') {
      const isNew = !store.get('ds-tut', '');
      html = `<h1 class="good title">Descent Systems</h1>
        <p class="tagline">Land anywhere in the solar system.</p>
        ${isNew ? `<button class="newbie" id="tutBtn"><b>New here? Start with the tutorial</b><span>A guided first landing, about a minute</span></button>` : ''}
        <nav class="menu" aria-label="Game modes">
          <button class="mode" data-setup="solo"><b>Free flight</b><span>Pick a world and land site after site</span></button>
          <button class="mode" data-go="missions"><b>Missions</b><span>${completedCount()} of ${MISSIONS.length} done · ${totalStars()} of ${MISSIONS.length * 3} ★</span></button>
          <button class="mode" data-setup="daily"><b>Daily challenge</b><span>Today: ${dailyWorld().name} · new in ${untilReset()}</span></button>
          <button class="mode" data-setup="hotseat"><b>Hot-seat</b><span>Two pilots, one screen, ${ROUNDS} rounds</span></button>
        </nav>
        <div class="subnav">
          <button class="link" id="hangarBtn">Hangar<span>${fmt(credits)} cr</span></button>
          <button class="link" id="badgesBtn">Badges<span>${earned()}/${ACH.length}</span></button>
          <button class="link" id="settingsBtn">Settings</button>
          <button class="link" id="howBtn">How to play</button>
          ${installLink()}
        </div>
        ${PWA && isIOS && !standalone() ? '<p class="limits" id="iosTip" hidden>In Safari, tap the Share button, then “Add to Home Screen”. The game then opens full-screen and works offline.</p>' : ''}`;
    } else if (m === 'setup') {
      const best = bestFor(world);
      const head = playMode === 'hotseat' ? 'Hot-seat' : playMode === 'daily' ? 'Daily challenge' : 'Free flight';
      const eyebrow = playMode === 'hotseat' ? `Two pilots · ${ROUNDS} rounds` : playMode === 'daily' ? 'Same terrain for every pilot' : 'Endless sites · 3 landers';
      html = `<span class="eyebrow">${eyebrow}</span>
        <h1 class="good">${head}</h1>
        ${playMode === 'daily' ? dailyBox() : `<p>Set down on a flat pad before the tank runs dry. Narrow pads pay more: <b>×5</b>, <b>×3</b>, <b>×2</b>.</p>
        <div class="worlds" role="group" aria-label="Choose a world">
          ${WORLDS.map(w => `<button class="world" data-id="${w.id}" aria-pressed="${w === world}">
            <i class="orb" style="background:${w.orb}"></i><b>${w.name}</b><span>${w.g.toFixed(2)} m/s²</span>
          </button>`).join('')}
        </div>`}
        <p>${world.note}</p>
        <div class="brief">
          <span>Gravity <b>${world.g.toFixed(2)} m/s²</b></span>
          <span>${(world.g / 9.81).toFixed(2)} g</span>
          <span>Air <b>${effectText(world)}</b></span>
          <span>Score <b>×${world.bonus}</b></span>
        </div>
        ${playMode === 'hotseat' ? `<div class="names">
          ${[0, 1].map(i => `<label for="p${i + 1}"><i class="dot" style="background:${PLAYER_TINT[i]}"></i>P${i + 1}
            <input id="p${i + 1}" maxlength="12" autocomplete="off" spellcheck="false" value="${esc(names[i])}"></label>`).join('')}
        </div>
        <p class="limits">Both pilots fly the same descent each round, and whoever goes second races the first pilot’s ghost. The first pilot alternates.</p>` : ''}
        <div class="btns">
          <button class="btn" id="go">${playMode === 'hotseat' ? `Start match on ${world.name}` : playMode === 'daily' ? 'Start today’s challenge' : `Descend to ${world.name}`}</button>
          <button class="btn ghost" id="menuBtn">Main menu</button>
        </div>
        <p class="keys-hint limits"><kbd>↑</kbd> thrust · <kbd>←</kbd><kbd>→</kbd> rotate${playMode !== 'daily' ? ' (on this screen: switch world)' : ''} · <kbd>P</kbd> pause · <kbd>Space</kbd> start</p>
        ${best && playMode === 'solo' ? `<p class="limits">Best on ${world.name}: ${fmt(best)}</p>` : ''}`;
    } else if (m === 'landed') {
      const r = lastResult;
      html = `<h1 class="good">Contact on ${world.name}</h1>
        <p>×${r.pad.mult} pad · ${r.base} pts + fuel bonus ${r.fuelBonus}${r.soft ? ' + soft landing 50' : ''}${world.bonus !== 1 ? ` × ${world.bonus} world bonus` : ''} = <b>${r.pts}</b></p>
        <p class="limits">Touchdown at ${r.vy.toFixed(2)} m/s vertical, ${r.vx.toFixed(2)} m/s horizontal, ${r.ang.toFixed(1)}° tilt</p>
        <p class="balance">+${fmt(r.pts)} credits banked · ${fmt(credits)} total</p>
        <button class="btn" id="go">Next site</button>`;
    } else if (m === 'crashed') {
      html = `<h1 class="bad">Lander lost</h1>
        <p>${cap(lastResult.reasons.join(', '))}.</p>
        ${limits}
        <p>${lives} lander${lives === 1 ? '' : 's'} remaining.</p>
        <button class="btn" id="go">Try again</button>`;
    } else if (m === 'over') {
      const prev = bestFor(world), isBest = score > prev;
      if (isBest) store.set('ds-best-' + world.id, score);
      html = `<h1 class="bad">Mission over</h1>
        <p>${cap(lastResult.reasons.join(', '))}.</p>
        <p>Final score <b>${score}</b> on ${world.name}, reaching site ${level}.${isBest ? ' New best for this world.' : ` Best: ${prev}.`}</p>
        <div class="btns">

  function drawPreview(time) {
    const pv = $('preview');
    if (!pv) return;
    const w = pv.clientWidth, h = pv.clientHeight;
    if (!w || !h) return;
    const pw = Math.round(w * dpr), ph = Math.round(h * dpr);
    if (pv.width !== pw || pv.height !== ph) { pv.width = pw; pv.height = ph; }
    const c = pv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, world.sky[0]); g.addColorStop(1, world.sky[1]);
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    const gy = h * 0.82;
    c.fillStyle = world.ground; c.fillRect(0, gy, w, h - gy);
    c.strokeStyle = world.rim; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(0, gy); c.lineTo(w, gy); c.stroke();
    c.strokeStyle = col.flame; c.lineWidth = 3;
    c.beginPath(); c.moveTo(w * 0.36, gy); c.lineTo(w * 0.64, gy); c.stroke();
    const s = h / 20;
    c.save();
    c.translate(w / 2, h * 0.36 + Math.sin(time / 700) * s * 0.4);
    c.rotate(Math.sin(time / 1300) * 0.08);
    c.scale(s, s);
    paintLander(c, { firing: true }, skin(), time, 1.6 / s);
    c.restore();
    c.save();
    c.translate(w * 0.74, gy);
    c.scale(s, s);
    paintFlag(c, skin().flag, time, 1, 1.4 / s);
    c.restore();
  }

    if (mode === 'missionEnd') { startMission(lastRun ? { ...lastRun, label: 'Last try', tint: col.reg } : null); return; }
    if (mode === 'setup' || mode === 'over' || mode === 'matchEnd' || mode === 'dailyEnd') {
      if (playMode === 'daily') { startDaily(); return; }
      rng = Math.random;
      level = 1; lives = 3; score = 0; levelFuel = 100;
      genTerrain(); spawn();
      match = playMode === 'hotseat'
        ? { round: 1, step: 0, first: 0, scores: [0, 0], log: [], runs: [], plan: spawnPlan }
        : null;
      fly(null);
    } else if (mode === 'landed') {
      level++; levelFuel = Math.max(45, 100 - (level - 1) * 8);
      if (daily) { daily.site = level; seedSite(level); }
      genTerrain(); spawn(); rng = Math.random;
      fly(null);
    } else if (mode === 'crashed') {
      // same start, same wind: race your previous attempt
      spawn(spawnPlan);
      fly({ ...lastRun, label: 'Last try', tint: col.reg });
    } else if (mode === 'turn') {
      match.step = 1;
      spawn(match.plan);
      fly(match.runs[match.first]);
    } else if (mode === 'roundEnd') {
      match.round++; match.step = 0; match.first = (match.round - 1) % 2;
      level = match.round; levelFuel = Math.max(45, 100 - (level - 1) * 8);
      genTerrain(); spawn();
      match.plan = spawnPlan;
      fly(null);
    }
  }
  function endTurn() {
    const pl = cur();
    match.scores[pl] += lastResult.pts;
    if (!match.log[match.round - 1]) match.log[match.round - 1] = [null, null];
    match.log[match.round - 1][pl] = lastResult;
    match.runs[pl] = { ...lastRun, label: names[pl], tint: PLAYER_TINT[pl] };
    if (match.step === 1) {
      const first = match.log[match.round - 1][match.first];
      if (lastResult.pts > (first ? first.pts : 0)) award('ghostbuster');
      if (match.round >= ROUNDS && match.scores[0] !== match.scores[1]) award('rival');
    }
    setMode(match.step === 0 ? 'turn' : match.round >= ROUNDS ? 'matchEnd' : 'roundEnd');
  }

  // ---- Rendering ----
  let scale = 1, base = 1, cw = 0, ch = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cw = stage.clientWidth; ch = stage.clientHeight;
    canvas.width = cw * dpr; canvas.height = ch * dpr;
    base = Math.min(cw / W, ch / H);
    scale = base * cam.z;
    makeBackdrop();
  }

  // ---- Camera ----
  // Full view at altitude; eases in as the lander nears the ground so the final metres are readable.
  const ZOOM_MAX = 2.6, ZOOM_START = 45, ZOOM_FULL = 12; // metres above ground
  const cam = { x: W / 2, y: H / 2, z: 1 };
  let autoZoom = store.get('ds-zoom', '1') === '1';
  let fullSpin = store.get('ds-spin', '1') === '1';   // full 360° rotation (off = classic ±90° limit)
  function resetCamera() { cam.x = W / 2; cam.y = H / 2; cam.z = 1; }
  function updateCamera(dt) {
    let tz = 1, tx = W / 2, ty = H / 2;
    const L = lander;
    const active = L && (mode === 'flying' || mode === 'paused' || mode === 'landed' || mode === 'crashed' || mode === 'over');
    if (active && autoZoom) {
      const g = groundAt(L.x);
      const alt = Math.max(0, L.y - 3 - g);
      const t = Math.max(0, Math.min(1, (ZOOM_START - alt) / (ZOOM_START - ZOOM_FULL)));
      const ease = t * t * (3 - 2 * t);
      tz = 1 + (ZOOM_MAX - 1) * ease;
      // keep the lander and the ground beneath it in frame
      tx = W / 2 + (L.x - W / 2) * ease;
      ty = H / 2 + ((L.y + g) / 2 - H / 2) * ease;
    }
    const k = 1 - Math.exp(-dt * 3.5);
    cam.z += (tz - cam.z) * k;
    cam.x += (tx - cam.x) * k;
    cam.y += (ty - cam.y) * k;
    scale = base * cam.z;
    // never show past the edges of the world once zoomed in
    const hw = cw / (2 * scale), hh = ch / (2 * scale);
    cam.x = hw * 2 >= W ? W / 2 : Math.max(hw, Math.min(W - hw, cam.x));
    cam.y = hh * 2 >= H ? H / 2 : Math.max(hh, Math.min(H - hh, cam.y));
  }
  function makeBackdrop() {
    stars = Array.from({ length: Math.round(cw * ch / 2500) }, () => ({
      x: Math.random() * cw, y: Math.random() * ch * 0.8, r: Math.random() < 0.1 ? 1.4 : 0.8, t: Math.random() * 6
    }));
    dust = world.wind ? Array.from({ length: 50 }, () => ({
      x: rand(0, W), y: rand(5, H * 0.7), v: rand(-1, 1), ph: rand(0, 6), r: rand(0.25, 0.6)
    })) : [];
  }
  const sx = x => cw / 2 + (x - cam.x) * scale;
  const sy = y => ch / 2 - (y - cam.y) * scale;

  const css = getComputedStyle(document.documentElement);
  const C = n => css.getPropertyValue(n).trim();
  const col = {
    reg: C('--regolith'), flame: C('--flame'), bad: C('--bad'), space: C('--space')
  };

  function draw(time) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const sky = ctx.createLinearGradient(0, 0, 0, ch);
    sky.addColorStop(0, world.sky[0]); sky.addColorStop(1, world.sky[1]);
    ctx.fillStyle = sky; ctx.fillRect(0, 0, cw, ch);

    if (world.stars) {
      for (const s of stars) {
        ctx.globalAlpha = world.stars * (0.35 + 0.35 * Math.sin(time / 900 + s.t));
        ctx.fillStyle = col.reg;
        ctx.fillRect(s.x, s.y, s.r, s.r);
      }
      ctx.globalAlpha = 1;
    }

    // wind-blown dust motes
    if (dust.length) {
      ctx.fillStyle = world.rim;
      for (const d of dust) {
        ctx.globalAlpha = 0.25;
        const len = Math.max(1, Math.abs(windNow) * 1.2) * scale;
        ctx.fillRect(sx(d.x), sy(d.y), windNow >= 0 ? -len : len, Math.max(1, d.r * scale * 0.5));
      }
      ctx.globalAlpha = 1;
    }

    if (terrain.length) {
      ctx.beginPath();
      ctx.moveTo(sx(0), ch);
      for (const [x, y] of terrain) ctx.lineTo(sx(x), sy(y));
      ctx.lineTo(sx(W), ch); ctx.closePath();
      ctx.fillStyle = world.ground; ctx.fill();
      ctx.beginPath();
      terrain.forEach(([x, y], i) => i ? ctx.lineTo(sx(x), sy(y)) : ctx.moveTo(sx(x), sy(y)));
      ctx.strokeStyle = world.rim; ctx.lineWidth = 1.5; ctx.stroke();

      // rock overhangs, filled up past the top of the screen
      for (const c of ceilings) {
        ctx.beginPath();
        ctx.moveTo(sx(c[0][0]), -5);
        for (const [x, y] of c) ctx.lineTo(sx(x), sy(y));
        ctx.lineTo(sx(c[c.length - 1][0]), -5);
        ctx.closePath();
        ctx.fillStyle = world.ground; ctx.fill();
        ctx.strokeStyle = world.rim; ctx.lineWidth = 1.5; ctx.stroke();
      }

      ctx.font = `600 ${Math.min(16, Math.max(10, base * 3.2 * Math.sqrt(cam.z)))}px ${C('--f-mono')}`;
      ctx.textAlign = 'center';
      for (const p of pads) {
        const lit = !mission || isGoalPad(p);
        ctx.globalAlpha = !lit ? 0.4 : mission ? 0.75 + 0.25 * Math.sin(time / 200) : 1;
        ctx.strokeStyle = col.flame; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(sx(p.x1), sy(p.y)); ctx.lineTo(sx(p.x2), sy(p.y)); ctx.stroke();
        ctx.fillStyle = col.flame;
        ctx.fillText(p.label || `×${p.mult}`, sx((p.x1 + p.x2) / 2), sy(p.y) + Math.min(24, Math.max(14, base * 4.5 * Math.sqrt(cam.z))));
        ctx.globalAlpha = 1;
      }
      if (mission) drawMissionProps(time);
      if (vents.length) drawVents(time);
    }

    const sk = skin();
    for (const p of particles) {
      const k = Math.max(0, p.life / p.max);
      ctx.globalAlpha = Math.min(1, k * 1.6);
      if (p.kind === 'fire') {
        const [core, tail] = flameColors(sk.flame, time / 1000, p.hue);
        ctx.fillStyle = k > 0.5 ? core : tail;
      } else {
        ctx.fillStyle = p.kind === 'blast' ? (k > 0.5 ? col.flame : col.bad) : col.reg;
      }
      const r = (p.kind !== 'debris' ? 0.5 + k * 0.6 : 0.6) * scale;
      ctx.fillRect(sx(p.x) - r / 2, sy(p.y) - r / 2, r, r);
    }
    ctx.globalAlpha = 1;

    if (ghost && showGhost && (mode === 'flying' || mode === 'paused')) drawGhost(time);
    const sitting = lastResult && lastResult.pad && (mode === 'landed' || mode === 'turn' || mode === 'roundEnd' || mode === 'matchEnd' || mode === 'dailyEnd' || mode === 'missionEnd' || mode === 'tutDone');
    if (sitting && flagPlant) drawFlag(time);
    if (mode === 'flying' || mode === 'paused' || sitting) drawLander(lander, time);
    if (mode === 'title' || mode === 'setup' || mode === 'settings') drawLander({ x: W / 2, y: H * 0.62, a: Math.sin(time / 1400) * 0.15, firing: true }, time);
    if (world.fog && lander && !MENU_MODES.includes(mode)) drawFog();
  }

  // Draws the lander in its own coordinates (metres, y pointing down), using the given skin.
  function paintLander(c, L, sk, time, lw) {
    const hull = sk.hull;
    c.lineWidth = lw;
    c.lineJoin = 'round';
    if (L.firing) {
      let len = 3 + Math.random() * 2.5;
      if (sk.flame.pulse) len *= 0.65 + 0.55 * Math.abs(Math.sin(time / 110));
      const [core, tail] = flameColors(sk.flame, time / 1000);
      c.beginPath(); c.moveTo(-1, 1.3); c.lineTo(0, 1.3 + len); c.lineTo(1, 1.3); c.closePath();
      c.fillStyle = tail; c.fill();
      c.beginPath(); c.moveTo(-0.55, 1.3); c.lineTo(0, 1.3 + len * 0.6); c.lineTo(0.55, 1.3); c.closePath();
      c.fillStyle = core; c.fill();
    }
    let fill = hull.fill;
    if (hull.chrome) {
      const o = (time / 2600) % 1;
      const g = c.createLinearGradient(-3, -4, 3, 1);
      g.addColorStop(0, '#4a5568');
      g.addColorStop(Math.max(0, o - 0.18), '#8a97ad');
      g.addColorStop(o, '#ffffff');
      g.addColorStop(Math.min(1, o + 0.18), '#8a97ad');
      g.addColorStop(1, '#4a5568');
      fill = g;
    }
    c.fillStyle = fill;
    c.strokeStyle = hull.stroke;
    // ascent stage
    c.beginPath();
    c.moveTo(-1.8, -0.5); c.lineTo(-2.2, -2.6); c.lineTo(-1, -3.8); c.lineTo(1, -3.8);
    c.lineTo(2.2, -2.6); c.lineTo(1.8, -0.5); c.closePath();
    c.fill(); c.stroke();
    // window
    c.strokeStyle = hull.detail;
    c.beginPath(); c.moveTo(-0.9, -2.9); c.lineTo(0, -3.3); c.lineTo(0.9, -2.9); c.stroke();
    // descent stage
    c.strokeStyle = hull.stroke;
    c.fillRect(-2.6, -0.5, 5.2, 1.5); c.strokeRect(-2.6, -0.5, 5.2, 1.5);
    // nozzle + legs
    c.strokeStyle = hull.legs;
    c.beginPath(); c.moveTo(-0.6, 1); c.lineTo(-0.9, 1.4); c.lineTo(0.9, 1.4); c.lineTo(0.6, 1); c.stroke();
    for (const s of [-1, 1]) {
      c.beginPath();
      c.moveTo(s * 2.2, 0.8); c.lineTo(s * 3.4, 3);
      c.moveTo(s * 1.4, 1); c.lineTo(s * 3.4, 3);
      c.moveTo(s * 2.8, 3); c.lineTo(s * 4, 3);
      c.stroke();
    }
    if (L.cargo) {
      c.fillStyle = '#b07a35'; c.strokeStyle = '#ffd9a0';
      c.fillRect(-1.3, -5.6, 2.6, 1.7); c.strokeRect(-1.3, -5.6, 2.6, 1.7);
      c.beginPath(); c.moveTo(-1.3, -5.6); c.lineTo(1.3, -3.9); c.moveTo(1.3, -5.6); c.lineTo(-1.3, -3.9); c.stroke();
    }
    if (L.crew) {
      c.fillStyle = Math.floor(time / 300) % 2 ? '#9fe0b8' : '#2f7a55';
      c.beginPath(); c.arc(0, -4.4, 0.5, 0, Math.PI * 2); c.fill();
    }
  }

  function drawGhost(time) {
    const fr = ghost.frames;
    if (!fr || !fr.length) return;
    const at = Math.floor(flightT * 60), done = at >= fr.length;
    const [x, y, a, f] = fr[Math.min(fr.length - 1, at)];
    ctx.save();
    if (done && ghost.result === 'crashed') {
      // mark where the ghost went down
      ctx.globalAlpha = 0.7; ctx.strokeStyle = ghost.tint; ctx.lineWidth = 2;
      const X = sx(x), Y = sy(y), r = Math.max(5, scale * 2);
      ctx.beginPath(); ctx.moveTo(X - r, Y - r); ctx.lineTo(X + r, Y + r); ctx.moveTo(X + r, Y - r); ctx.lineTo(X - r, Y + r); ctx.stroke();
    } else {
      ctx.globalAlpha = 0.45;
      ctx.translate(sx(x), sy(y)); ctx.rotate(a); ctx.scale(scale, scale);
      paintLander(ctx, { firing: !done && f === 1 }, ghostSkin(ghost.tint), time, 1.6 / scale);
    }
    ctx.restore();
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = ghost.tint;
    ctx.font = `500 11px ${C('--f-mono')}`;
    ctx.textAlign = 'center';
    ctx.fillText(String(ghost.label).toUpperCase(), sx(x), sy(y + 5) - 4);
    ctx.globalAlpha = 1;
  }

  function starPath(c, cx, cy, r) {
    c.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.42 : r;
      c.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
    }
    c.closePath();
  }
  // Draws a flag with its pole foot at the origin (metres, y down). prog 0→1 raises the pole, then unfurls the cloth.
  function paintFlag(c, f, time, prog, lw) {
    if (!f || prog <= 0) return;
    const poleH = 6 * Math.min(1, prog / 0.55);
    c.lineCap = 'round';
    c.strokeStyle = '#c9cfdc'; c.lineWidth = lw;
    c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -poleH); c.stroke();
    const u = Math.max(0, Math.min(1, (prog - 0.55) / 0.45));
    if (!u) return;
    const fw = 3.6 * u, fh = 2.3, top = -6;
    const [c0, c1, c2] = f.colors;
    if (f.style === 'pennant') {
      c.beginPath(); c.moveTo(0, top); c.lineTo(fw, top + fh / 2); c.lineTo(0, top + fh); c.closePath();
      c.fillStyle = c0; c.fill();
    } else if (f.style === 'stripes') {
      [c0, c1, c2].forEach((col, i) => { c.fillStyle = col; c.fillRect(0, top + i * fh / 3, fw, fh / 3 + 0.02); });
    } else if (f.style === 'star') {
      c.fillStyle = c0; c.fillRect(0, top, fw, fh);
      c.fillStyle = c1; starPath(c, fw / 2, top + fh / 2, 0.75 * u); c.fill();
    } else if (f.style === 'checker') {
      const cols = 6, rows = 4;
      for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
        c.fillStyle = (i + j) % 2 ? c1 : c0;
        c.fillRect(i * fw / cols, top + j * fh / rows, fw / cols + 0.02, fh / rows + 0.02);
      }
    } else if (f.style === 'skull') {
      c.fillStyle = c0; c.fillRect(0, top, fw, fh);
      c.fillStyle = c1; c.strokeStyle = c1; c.lineWidth = lw * 1.3;
      c.beginPath(); c.arc(fw / 2, top + fh * 0.38, 0.5 * u, 0, Math.PI * 2); c.fill();
      c.beginPath();
      c.moveTo(fw / 2 - 0.8 * u, top + fh * 0.62); c.lineTo(fw / 2 + 0.8 * u, top + fh * 0.88);
      c.moveTo(fw / 2 + 0.8 * u, top + fh * 0.62); c.lineTo(fw / 2 - 0.8 * u, top + fh * 0.88);
      c.stroke();
    } else if (f.style === 'wave') {
      const g = c.createLinearGradient(0, 0, fw, 0);
      g.addColorStop(0, c0); g.addColorStop(1, c1);
      c.fillStyle = g;
      const n = 14;
      for (let i = 0; i < n; i++) {
        const k = i / n, off = Math.sin(time / 240 - i * 0.7) * 0.32 * k;
        c.fillRect(k * fw, top + off, fw / n + 0.1, fh);
      }
    }
  }
  function drawVents(time) {
    const lava = world.hazard === 'volcano';
    for (const v of vents) {
      const st = ventState(v), gy = groundAt(v.x);
      ctx.fillStyle = lava ? '#ff6a2a' : '#bfe3ff';
      ctx.globalAlpha = st.warn ? 0.35 + 0.65 * Math.abs(Math.sin(time / 90)) : st.on ? 1 : 0.3;
      ctx.beginPath(); ctx.ellipse(sx(v.x), sy(gy), 2.2 * scale, 0.7 * scale, 0, 0, Math.PI * 2); ctx.fill();
      if (st.on) {
        const hgt = plumeTop(v, st) - gy, r = (lava ? 0.7 : 1.1) * scale;
        for (let i = 0; i < 46; i++) {
          const f = Math.random(), spread = 1.2 + f * 2.4;
          ctx.globalAlpha = (lava ? 0.9 : 0.5) * (1 - f * 0.6);
          ctx.fillStyle = lava ? (Math.random() < 0.5 ? '#ffd23f' : '#ff5a1f') : '#e8f6ff';
          ctx.fillRect(sx(v.x + (Math.random() * 2 - 1) * spread) - r / 2, sy(gy + f * hgt) - r / 2, r, r);
        }
      }
    }
    ctx.globalAlpha = 1;
  }
  // Venus: clouds hide everything beyond a short radius around the lander; pad beacons show through.
  function drawFog() {
    const cx = sx(lander.x), cy = sy(lander.y), r = 24 * scale;
    const g = ctx.createRadialGradient(cx, cy, r * 0.6, cx, cy, r * 2.3);
    g.addColorStop(0, `rgba(${world.fog}, 0)`);
    g.addColorStop(1, `rgba(${world.fog}, 0.97)`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, cw, ch);
    ctx.font = `600 ${Math.min(16, Math.max(10, base * 3.2 * Math.sqrt(cam.z)))}px ${C('--f-mono')}`;
    ctx.textAlign = 'center';
    for (const p of pads) {
      const X = sx((p.x1 + p.x2) / 2), Y = sy(p.y);
      ctx.strokeStyle = col.flame; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(sx(p.x1), Y); ctx.lineTo(sx(p.x2), Y); ctx.stroke();
      ctx.fillStyle = col.flame;
      ctx.fillText(p.label || `×${p.mult}`, X, Y + Math.min(24, Math.max(14, base * 4.5 * Math.sqrt(cam.z))));
    }
  }

  function drawCrate(x, y) {
    ctx.save();
    ctx.translate(sx(x), sy(y)); ctx.scale(scale, scale);
    ctx.lineWidth = 1.4 / scale;
    ctx.fillStyle = '#b07a35'; ctx.strokeStyle = '#ffd9a0';
    ctx.fillRect(-1.3, -1.7, 2.6, 1.7); ctx.strokeRect(-1.3, -1.7, 2.6, 1.7);
    ctx.beginPath(); ctx.moveTo(-1.3, -1.7); ctx.lineTo(1.3, 0); ctx.moveTo(1.3, -1.7); ctx.lineTo(-1.3, 0); ctx.stroke();
    ctx.restore();
  }
  function drawCrew(x, y, time, i) {
    ctx.save();
    ctx.translate(sx(x), sy(y)); ctx.scale(scale, scale);
    ctx.lineWidth = 1.4 / scale; ctx.lineCap = 'round';
    ctx.strokeStyle = '#9fe0b8';
    const wave = Math.sin(time / 180 + i * 1.7) * 0.35;
    ctx.beginPath(); ctx.arc(0, -1.9, 0.3, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, -1.6); ctx.lineTo(0, -0.7);
    ctx.moveTo(0, -0.7); ctx.lineTo(-0.35, 0); ctx.moveTo(0, -0.7); ctx.lineTo(0.35, 0);
    ctx.moveTo(0, -1.35); ctx.lineTo(-0.45, -0.95);
    ctx.moveTo(0, -1.35); ctx.lineTo(0.5, -2.05 + wave);
    ctx.stroke();
    ctx.restore();
  }
  function drawMissionProps(time) {
    const g = currentGoal();
    for (const p of pads) {
      if (g && g.type === 'pickup' && g.pad === p.id && !mission.carrying) {
        if (g.what === 'cargo') drawCrate(p.x2 - 1.8, p.y);
        else for (let i = 0; i < 3; i++) drawCrew(p.x2 - 1 - i * 1.4, p.y, time, i);
      }
      if (mission.dropped === p) drawCrate(p.x2 - 1.8, p.y);
    }
    if (g && g.type === 'exit') {
      const y = Math.max(2, sy(H - 0.5));
      ctx.save();
      ctx.globalAlpha = 0.5 + 0.3 * Math.sin(time / 300);
      ctx.strokeStyle = col.flame; ctx.lineWidth = 1.5; ctx.setLineDash([8, 8]);
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cw, y); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = col.flame; ctx.font = `600 12px ${C('--f-mono')}`; ctx.textAlign = 'center';
      ctx.fillText('ORBIT ↑', cw / 2, y + 16);
      ctx.restore();
    }
  }

  function drawFlag(time) {
    const prog = (time - flagPlant.t - 350) / 700;
    ctx.save();
    ctx.translate(sx(flagPlant.x), sy(flagPlant.y));
    ctx.scale(scale, scale);
    paintFlag(ctx, skin().flag, time, prog, 1.6 / scale);
    ctx.restore();
  }

  function drawLander(L, time) {
    ctx.save();
    ctx.translate(sx(L.x), sy(L.y));
    ctx.rotate(L.a);
    ctx.scale(scale, scale);
    paintLander(ctx, L, skin(), time, 1.9 / scale);
    ctx.restore();

    if (L === lander && sy(L.y + 4) < 0) {
      ctx.fillStyle = col.flame;
      ctx.beginPath();
      const x = sx(L.x), y = 10;
      ctx.moveTo(x, y - 6); ctx.lineTo(x - 6, y + 4); ctx.lineTo(x + 6, y + 4); ctx.fill();
    }
  }

  // ---- HUD ----
  const hud = {
    alt: $('alt'), vx: $('vx'), vy: $('vy'), ang: $('ang'), wind: $('wind'), windRow: $('windRow'),
    fuelTxt: $('fuelTxt'), fuelBar: $('fuelBar'), score: $('score'), meta: $('meta')
  };
  const grade = (v, lim) => v <= lim ? 'ok' : v <= lim * 2 ? 'warn' : 'bad';
  function updateHud() {
    const L = lander;
    if (!L) return;
    const alt = Math.max(0, L.y - 3 - groundAt(L.x));
    const vy = -L.vy, vx = Math.abs(L.vx), ang = L.a * 180 / Math.PI;
    hud.alt.textContent = `${alt.toFixed(1)} m`;
    hud.vx.textContent = `${L.vx >= 0 ? '→' : '←'} ${vx.toFixed(1)} m/s`;
    hud.vy.textContent = `${vy >= 0 ? '↓' : '↑'} ${Math.abs(vy).toFixed(1)} m/s`;
    hud.ang.textContent = `${ang.toFixed(0)}°`;
    hud.vx.className = grade(vx, SAFE_VX);
    hud.vy.className = vy < 0 ? 'ok' : grade(vy, SAFE_VY);
    hud.ang.className = grade(Math.abs(ang), SAFE_ANG);
    hud.windRow.hidden = !world.wind;
    if (world.wind) {
      hud.wind.textContent = `${windNow >= 0 ? '→' : '←'} ${Math.abs(windNow).toFixed(1)} m/s²`;
      hud.wind.className = Math.abs(windNow) > world.wind * 0.8 ? 'warn' : '';
    }
    hud.fuelTxt.textContent = `${Math.ceil(L.fuel)} kg`;
    hud.fuelTxt.className = L.fuel > 25 ? '' : L.fuel > 0 ? 'warn' : 'bad';
    hud.fuelBar.style.width = `${L.fuel / (L.fuelMax || 100) * 100}%`;
    if (tut) {
      hud.score.textContent = '—';
      hud.meta.textContent = `TUTORIAL · STEP ${tut.step + 1} OF 4`;
      hud.meta.style.color = 'var(--flame)';
    } else if (mission) {
      hud.score.textContent = `${flightT.toFixed(1)} s`;
      hud.meta.textContent = `MISSION ${missionSel + 1} · ${mission.def.name.toUpperCase()}`;
      hud.meta.style.color = 'var(--flame)';
    } else if (match) {
      hud.score.textContent = fmt(match.scores[cur()]);
      hud.meta.textContent = `${names[cur()].toUpperCase()} · ROUND ${match.round}/${ROUNDS} · ${world.name.toUpperCase()}`;
      hud.meta.style.color = PLAYER_TINT[cur()];
    } else {
      hud.score.textContent = fmt(score);
      hud.meta.textContent = daily
        ? `DAILY · ${world.name.toUpperCase()} · SITE ${daily.site}/${DAILY_SITES}`
        : `${world.name.toUpperCase()} · SITE ${level} · LANDERS ${lives}`;
      hud.meta.style.color = daily ? 'var(--flame)' : '';
    }
    const obj = $('objective');
    if (mission && (mode === 'flying' || mode === 'paused')) { obj.hidden = false; obj.textContent = goalText(); }
    else obj.hidden = true;
  }

  // ---- Loop ----
  let last = performance.now(), acc = 0;
  const DT = 1 / 120;
  function frame(now) {
    const frameDt = Math.min(0.1, (now - last) / 1000);
    acc += frameDt;
    last = now;
    if (mode === 'paused') acc = 0;   // freeze the simulation, wind clock included
    else while (acc >= DT) { step(DT); acc -= DT; }
    sfx.update({
      engine: mode === 'flying' && lander.firing,
      rcs: mode === 'flying' && (keys.left || keys.right) && lander.fuel > 0,
      wind: (mode === 'flying' || mode === 'landed') && world.wind ? Math.min(0.35, Math.abs(windNow) * 0.12) : 0,
      bright: world.drag > 0 ? 1100 : 420   // muffled in a vacuum, brighter where there's air
    });
    fuelAlarm(frameDt);
    updateCamera(frameDt);
    draw(now);
    if (mode === 'hangar') drawPreview(now);
    updateHud();
    requestAnimationFrame(frame);
  }

  // ---- Input ----
  const keyMap = {
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right',
    ArrowUp: 'thrust', KeyW: 'thrust'
  };
  // screens where Space/Enter means "continue"; elsewhere they press the focused button as usual
  const ADVANCES = ['setup', 'brief', 'landed', 'crashed', 'over', 'turn', 'roundEnd', 'matchEnd', 'dailyEnd', 'missionEnd', 'paused', 'tutDone', 'tutFail'];
  addEventListener('keydown', e => {
    if (e.target instanceof HTMLInputElement || e.target instanceof HTMLTextAreaElement) {
      if (e.code === 'Enter') e.target.blur();
      return;
    }
    const k = keyMap[e.code];
    if (mode === 'brief' && e.code === 'Escape') { setMode('missions'); return; }
    if (mode === 'hangar' || mode === 'badges' || mode === 'missions' || mode === 'settings' || (mode === 'setup' && e.code === 'Escape')) {
      if (e.code === 'Escape') { trying = null; setMode('title'); }
      return;
    }
    if ((e.code === 'KeyP' || e.code === 'Escape') && !e.repeat) {
      if (mode === 'flying') { setMode('paused'); e.preventDefault(); return; }
      if (mode === 'paused') { setMode('flying'); e.preventDefault(); return; }
    }
    if ((mode === 'title' || mode === 'over') && e.code === 'KeyB' && !e.repeat) { setMode('badges'); return; }
    if ((mode === 'title' || mode === 'over') && e.code === 'KeyH' && !e.repeat) { setMode('hangar'); return; }
    if (mode === 'setup' && playMode !== 'daily' && (k === 'left' || k === 'right')) {
      e.preventDefault();
      if (e.repeat) return;
      const i = WORLDS.indexOf(world) + (k === 'left' ? -1 : 1);
      selectWorld(WORLDS[(i + WORLDS.length) % WORLDS.length]);
      return;
    }
    if (e.code === 'KeyM' && !e.repeat) { toggleMute(); return; }
    if (e.code === 'KeyG' && !e.repeat) {
      showGhost = !showGhost;
      store.set('ds-ghost', showGhost ? '1' : '0');
      showToast(`Ghost ${showGhost ? 'on' : 'off'}`);
      if (mode === 'settings') renderSettings();
      return;
    }
    if (e.code === 'KeyZ' && !e.repeat) {
      autoZoom = !autoZoom;
      store.set('ds-zoom', autoZoom ? '1' : '0');
      showToast(`Auto-zoom ${autoZoom ? 'on' : 'off'}`);
      if (mode === 'settings') renderSettings();
      return;
    }
    if (k) { keys[k] = mode === 'flying'; e.preventDefault(); }
    else if (e.code === 'Space' && ADVANCES.includes(mode)) { e.preventDefault(); advance(); }
    else if (e.code === 'Enter' && ADVANCES.includes(mode) && !document.activeElement.classList.contains('world')) { e.preventDefault(); advance(); }
    else if (e.code === 'Space') e.preventDefault();
  });
  addEventListener('keyup', e => { const k = keyMap[e.code]; if (k) keys[k] = false; });
  // auto-pause when the player looks away
  addEventListener('blur', () => { keys.left = keys.right = keys.thrust = false; if (mode === 'flying') setMode('paused'); });

  [['bl', 'left'], ['bt', 'thrust'], ['br', 'right']].forEach(([id, k]) => {
    const b = $(id);
    const on = e => { e.preventDefault(); if (mode !== 'flying') return; keys[k] = true; b.classList.add('held'); try { b.setPointerCapture(e.pointerId); } catch (_) {} };
    const off = () => { keys[k] = false; b.classList.remove('held'); };
    b.addEventListener('pointerdown', on);
    b.addEventListener('pointerup', off);
    b.addEventListener('pointercancel', off);
    b.addEventListener('lostpointercapture', off);
    b.addEventListener('contextmenu', e => e.preventDefault());
  });

  // Browsers only allow audio after the player interacts, so start it on the first key or tap.
  // iPhones only allow it when a tap ends (touchend/click), not when it starts, so listen for all of them.
  for (const type of ['pointerdown', 'touchend', 'click', 'keydown']) addEventListener(type, () => sfx.unlock(), { capture: true });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { sfx.suspend(); if (mode === 'flying') setMode('paused'); }
    else sfx.unlock();
  });
  $('pauseBtn').addEventListener('click', () => { if (mode === 'flying') setMode('paused'); });
  const muteBtn = $('mute');
  function syncMute() {
    muteBtn.textContent = sfx.muted ? 'Sound off' : 'Sound on';
    muteBtn.setAttribute('aria-pressed', String(sfx.muted));
  }
  function toggleMute() {
    sfx.setMuted(!sfx.muted);
    syncMute();
    showToast(sfx.muted ? 'Sound off' : 'Sound on');
    if (mode === 'settings') renderSettings('setSound');
  }
  muteBtn.addEventListener('click', toggleMute);
  syncMute();

  new ResizeObserver(resize).observe(stage);
  resize();
  genTerrain();
  spawn();
  setMode('title');
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
