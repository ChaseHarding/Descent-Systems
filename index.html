<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Descent Systems</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-height stage — canvas fills it, instrument HUD pinned top-left, touch pad below on phones.
   Each world brings its own sky/ground colors into the canvas; the HUD chrome stays constant. */
:root {
  --space: #0a0e1c;
  --space-2: #121a33;
  --regolith: #c9cfdc;
  --regolith-dim: #6c7690;
  --flame: #ffb547;
  --ok: #9fe0b8;
  --warn: #ffb547;
  --bad: #ff6b5e;
  --panel: rgba(10, 14, 28, 0.78);
  --f-display: "Chakra Petch", "Trebuchet MS", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--space);
  color: var(--regolith);
  font-family: var(--f-mono);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  touch-action: none;
}
.app {
  height: 100%;
  display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  gap: 10px;
  box-sizing: border-box;
}
.stage {
  position: relative; flex: 1; min-height: 0;
  border: 1px solid var(--space-2);
  border-radius: 6px;
  overflow: hidden;
  background: var(--space);
}
canvas { display: block; width: 100%; height: 100%; }

.hud {
  position: absolute; top: 10px; left: 10px;
  display: grid; grid-template-columns: auto auto; column-gap: 14px; row-gap: 2px;
  padding: 10px 12px; margin: 0;
  background: var(--panel);
  border: 1px solid var(--space-2);
  border-radius: 4px;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  pointer-events: none;
}
.hud .row { display: contents; }
.hud dt { color: var(--regolith-dim); letter-spacing: 0.08em; }
.hud dd { margin: 0; text-align: right; min-width: 7ch; }
.hud dd.ok { color: var(--ok); }
.hud dd.warn { color: var(--warn); }
.hud dd.bad { color: var(--bad); }
.fuel { grid-column: 1 / -1; height: 5px; background: var(--space-2); margin-top: 6px; border-radius: 2px; overflow: hidden; }
.fuel i { display: block; height: 100%; background: var(--flame); width: 100%; }

.score {
  position: absolute; top: 10px; right: 10px;
  text-align: right; font-size: 12px; pointer-events: none;
  font-variant-numeric: tabular-nums;
  padding: 6px 10px; background: var(--panel); border-radius: 4px;
}
.score b { display: block; font-family: var(--f-display); font-size: 22px; font-weight: 700; color: var(--regolith); }
.score span { color: var(--regolith-dim); letter-spacing: 0.08em; }

.overlay {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  background: rgba(10, 14, 28, 0.6);
  padding: 16px;
  overflow-y: auto;
}
.card {
  max-width: 40rem; text-align: center;
  display: flex; flex-direction: column; gap: 12px; align-items: center;
}
.card h1 {
  font-family: var(--f-display); font-weight: 700;
  font-size: clamp(28px, 6vw, 52px); letter-spacing: 0.04em;
  margin: 0; text-wrap: balance; text-transform: uppercase; line-height: 1.05;
}
.card h1.bad { color: var(--bad); }
.card h1.good { color: var(--flame); }
.card p { margin: 0; line-height: 1.6; font-size: 13px; color: var(--regolith); text-wrap: pretty; }
.card .limits { color: var(--regolith-dim); font-size: 12px; }
kbd {
  font-family: var(--f-mono); font-size: 11px;
  border: 1px solid var(--regolith-dim); border-radius: 3px; padding: 1px 5px;
}
.btn {
  font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--space); background: var(--flame);
  border: 0; border-radius: 4px; padding: 10px 22px; cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--regolith); border: 1px solid var(--regolith-dim); }
.btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.btn:focus-visible, .pad button:focus-visible, .world:focus-visible { outline: 2px solid var(--regolith); outline-offset: 3px; }

/* World picker */
.worlds { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.world {
  width: 96px; padding: 10px 6px 8px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  background: var(--panel); color: var(--regolith);
  border: 1px solid var(--space-2); border-radius: 6px; cursor: pointer;
  font-family: var(--f-mono); font-size: 11px;
}
.world .orb { width: 30px; height: 30px; border-radius: 50%; box-shadow: inset -6px -5px 0 rgba(0,0,0,0.35); }
.world b { font-family: var(--f-display); font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase; }
.world span { color: var(--regolith-dim); font-variant-numeric: tabular-nums; }
.world[aria-pressed="true"] { border-color: var(--flame); }
.world[aria-pressed="true"] b { color: var(--flame); }
.brief {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px;
  font-size: 12px; color: var(--regolith-dim); font-variant-numeric: tabular-nums;
}
.brief b { color: var(--regolith); font-weight: 500; }

.pad { display: none; gap: 10px; }
.pad button {
  flex: 1; height: 64px;
  font-family: var(--f-display); font-weight: 700; font-size: 14px; letter-spacing: 0.1em;
  color: var(--regolith); background: var(--space-2);
  border: 1px solid var(--regolith-dim); border-radius: 6px;
  touch-action: none;
}
.pad button.thrust { flex: 1.6; color: var(--flame); border-color: var(--flame); }
.pad button.held { background: var(--regolith-dim); color: var(--space); }
@media (pointer: coarse) { .pad { display: flex; } .keys-hint { display: none; } }
@media (max-width: 520px) {
  .hud { font-size: 11px; padding: 8px 10px; }
  .score b { font-size: 18px; }
  .world { width: 84px; }
}
</style>
</head>
<body>

<div class="app">
  <div class="stage" id="stage">
    <canvas id="c"></canvas>
    <dl class="hud" aria-live="off">
      <div class="row"><dt>ALT</dt><dd id="alt">0.0 m</dd></div>
      <div class="row"><dt>H-SPD</dt><dd id="vx">0.0 m/s</dd></div>
      <div class="row"><dt>V-SPD</dt><dd id="vy">0.0 m/s</dd></div>
      <div class="row"><dt>ATT</dt><dd id="ang">0°</dd></div>
      <div class="row" id="windRow"><dt>WIND</dt><dd id="wind">0.0</dd></div>
      <div class="row"><dt>FUEL</dt><dd id="fuelTxt">100 kg</dd></div>
      <div class="fuel"><i id="fuelBar"></i></div>
    </dl>
    <div class="score">
      <b id="score">0</b>
      <span id="meta">MOON · SITE 1 · LANDERS 3</span>
    </div>
    <div class="overlay" id="overlay">
      <div class="card" id="card"></div>
    </div>
  </div>
  <div class="pad" id="pad">
    <button id="bl" aria-label="Rotate left">◀ ROT</button>
    <button id="bt" class="thrust" aria-label="Thrust">THRUST</button>
    <button id="br" aria-label="Rotate right">ROT ▶</button>
  </div>
</div>

<script>
(() => {
  // ---- Worlds ----
  // g: surface gravity (m/s²). thrust: engine accel at full burn. drag: air resistance per second.
  // wind: peak gust strength (m/s²). bonus: score multiplier for difficulty.
  const WORLDS = [
    {
      id: 'pluto', name: 'Pluto', g: 0.62, thrust: 1.9, drag: 0, wind: 0, bonus: 0.75, rough: 0.8,
      note: 'Weak pull, slow fall. A forgiving first descent.',
      sky: ['#05060d', '#141222'], stars: 1,
      ground: '#3b3038', rim: '#d8c1ad', orb: '#cfb59c'
    },
    {
      id: 'moon', name: 'Moon', g: 1.62, thrust: 4.2, drag: 0, wind: 0, bonus: 1, rough: 1,
      note: 'The classic. No air, nothing to help or hinder you.',
      sky: ['#0a0e1c', '#0f1528'], stars: 1,
      ground: '#161e38', rim: '#7d88a6', orb: '#c9cfdc'
    },
    {
      id: 'titan', name: 'Titan', g: 1.35, thrust: 3.6, drag: 0.35, wind: 0.35, bonus: 1, rough: 0.9,
      note: 'Air thicker than Earth’s. Drag bleeds off speed, so you drift down gently.',
      sky: ['#2b1a0b', '#6e4518'], stars: 0,
      ground: '#3d2812', rim: '#e0a85c', orb: '#d99a45'
    },
    {
      id: 'mars', name: 'Mars', g: 3.71, thrust: 9.4, drag: 0.04, wind: 1.3, bonus: 1.5, rough: 1.25,
      note: 'Over twice the Moon’s pull and gusting dust storms. Watch the wind gauge.',
      sky: ['#1d0f10', '#5a2a1e'], stars: 0.35,
      ground: '#4a2015', rim: '#e88a5c', orb: '#d0613a'
    },
    {
      id: 'earth', name: 'Earth', g: 9.81, thrust: 22, drag: 0.08, wind: 2.2, bonus: 2.5, rough: 1.4,
      note: 'Hard mode. You fall fast and the engine is twitchy. Short, early burns.',
      sky: ['#0e2448', '#3d79b0'], stars: 0,
      ground: '#1d3a22', rim: '#8fcf7e', orb: '#3f86c9'
    }
  ];

  // ---- World constants (meters, seconds) ----
  const W = 240, H = 150;
  const ROT_RATE = 110 * Math.PI / 180;
  const BURN = 7, RCS_BURN = 0.8;
  const SAFE_VY = 2.0, SAFE_VX = 1.0, SAFE_ANG = 10;
  const FEET = [[-3.4, -3], [3.4, -3]];
  const HULL = [[-2.5, 0.5], [2.5, 0.5], [-1.8, 3.4], [1.8, 3.4], [0, 3.8]];

  const $ = id => document.getElementById(id);
  const canvas = $('c'), ctx = canvas.getContext('2d');
  const stage = $('stage'), overlay = $('overlay'), card = $('card');

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} }
  };
  let world = WORLDS.find(w => w.id === store.get('ds-world', 'moon')) || WORLDS[1];
  const bestFor = w => +store.get('ds-best-' + w.id, 0) || 0;

  // ---- State ----
  const keys = { left: false, right: false, thrust: false };
  let terrain = [], pads = [], stars = [], dust = [];
  let lander, particles = [];
  let mode = 'title';
  let level = 1, lives = 3, score = 0, levelFuel = 100;
  let lastResult = null;
  let simT = 0, windDir = 1, windSeed = 0, windNow = 0;

  const rand = (a, b) => a + Math.random() * (b - a);

  // ---- Terrain ----
  function genTerrain() {
    const step = 6, n = Math.round(W / step);
    const rough = (4 + level * 1.2) * world.rough;
    const h = [];
    let y = rand(20, 50);
    for (let i = 0; i <= n; i++) {
      y += rand(-1, 1) * rough;
      y = Math.max(6, Math.min(H * 0.5, y));
      h.push(y);
    }
    const defs = [{ len: 2, mult: 5 }, { len: 3, mult: 3 }, { len: 5, mult: 2 }]
      .sort(() => Math.random() - 0.5);
    pads = [];
    const third = Math.floor(n / 3);
    defs.forEach((d, k) => {
      const lo = k * third + 1, hi = (k + 1) * third - d.len - 1;
      const s = Math.floor(rand(lo, Math.max(lo, hi)));
      const py = h[s];
      for (let i = s; i <= s + d.len; i++) h[i] = py;
      pads.push({ x1: s * step, x2: (s + d.len) * step, y: py, mult: d.mult });
    });
    terrain = h.map((y, i) => [i * step, y]);
    windDir = Math.random() < 0.5 ? -1 : 1;
    windSeed = rand(0, 100);
  }
  function groundAt(x) {
    const step = terrain[1][0];
    const i = Math.max(0, Math.min(terrain.length - 2, Math.floor(x / step)));
    const [x0, y0] = terrain[i], [x1, y1] = terrain[i + 1];
    const t = Math.max(0, Math.min(1, (x - x0) / (x1 - x0)));
    return y0 + (y1 - y0) * t;
  }
  // Gusting wind: a steady breeze plus two slow waves, occasionally reversing on stormy worlds.
  function windAt(t) {
    if (!world.wind) return 0;
    const s = t + windSeed;
    const gust = 0.55 + 0.35 * Math.sin(s * 0.45) + 0.25 * Math.sin(s * 1.6 + 1.3);
    return world.wind * windDir * gust;
  }

  // ---- Lander ----
  function spawn() {
    lander = {
      x: rand(W * 0.2, W * 0.8), y: H - 12,
      vx: rand(-4, 4), vy: 0, a: 0,
      fuel: levelFuel, firing: false
    };
    particles = [];
  }
  function toWorld(lx, ly, L = lander) {
    const c = Math.cos(L.a), s = Math.sin(L.a);
    return [L.x + lx * c + ly * s, L.y - lx * s + ly * c];
  }

  // ---- Simulation ----
  function step(dt) {
    simT += dt;
    windNow = windAt(simT);
    const L = lander;
    if (mode === 'flying') {
      let rot = 0;
      if (keys.left) rot -= 1;
      if (keys.right) rot += 1;
      if (rot && L.fuel > 0) {
        L.a = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, L.a + rot * ROT_RATE * dt));
        L.fuel = Math.max(0, L.fuel - RCS_BURN * dt);
      }
      L.firing = keys.thrust && L.fuel > 0;
      let ax = windNow - world.drag * L.vx;
      let ay = -world.g - world.drag * L.vy;
      if (L.firing) {
        ax += Math.sin(L.a) * world.thrust;
        ay += Math.cos(L.a) * world.thrust;
        L.fuel = Math.max(0, L.fuel - BURN * dt);
        if (Math.random() < 0.9) emitExhaust();
      }
      L.vx += ax * dt; L.vy += ay * dt;
      L.x += L.vx * dt; L.y += L.vy * dt;
      if (L.x < 4) { L.x = 4; L.vx = Math.abs(L.vx) * 0.3; }
      if (L.x > W - 4) { L.x = W - 4; L.vx = -Math.abs(L.vx) * 0.3; }
      checkContact();
    }
    for (const p of particles) {
      p.vy -= (p.g ?? 0) * dt;
      p.vx += windNow * 3 * dt - world.drag * 2 * p.vx * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.y < groundAt(p.x)) { p.y = groundAt(p.x); p.vy *= -0.3; p.vx *= 0.6; }
      p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);
    for (const d of dust) {
      d.x += (windNow * 9 + d.v) * dt;
      d.y += Math.sin(simT * 2 + d.ph) * 0.6 * dt;
      if (d.x > W + 5) d.x -= W + 10;
      if (d.x < -5) d.x += W + 10;
    }
  }

  function emitExhaust() {
    const L = lander;
    const [ex, ey] = toWorld(rand(-0.6, 0.6), -1.4);
    const spd = rand(10, 18);
    const dir = L.a + Math.PI + rand(-0.25, 0.25);
    particles.push({
      x: ex, y: ey,
      vx: Math.sin(dir) * spd + L.vx, vy: Math.cos(dir) * spd + L.vy,
      life: rand(0.25, 0.6), max: 0.6, kind: 'fire'
    });
  }
  function explode() {
    const L = lander;
    for (let i = 0; i < 90; i++) {
      const a = rand(0, Math.PI * 2), s = rand(3, 22);
      particles.push({
        x: L.x, y: L.y + 1, vx: Math.cos(a) * s + L.vx * 0.3, vy: Math.abs(Math.sin(a)) * s,
        g: Math.max(3, world.g * 2), life: rand(0.8, 2.4), max: 2.4, kind: i % 3 ? 'fire' : 'debris'
      });
    }
  }

  function checkContact() {
    const L = lander;
    const feet = FEET.map(([x, y]) => toWorld(x, y));
    const hull = HULL.map(([x, y]) => toWorld(x, y));
    const hullHit = hull.some(([x, y]) => y <= groundAt(x));
    const footHit = feet.some(([x, y]) => y <= groundAt(x));
    if (!hullHit && !footHit) return;

    const pad = pads.find(p => feet.every(([x]) => x >= p.x1 && x <= p.x2));
    const angDeg = Math.abs(L.a * 180 / Math.PI);
    const vy = -L.vy, vx = Math.abs(L.vx);
    const stats = { vy, vx, ang: angDeg };

    if (!hullHit && pad && vy <= SAFE_VY && vx <= SAFE_VX && angDeg <= SAFE_ANG) {
      L.y += pad.y - Math.min(...feet.map(f => f[1]));
      L.vx = L.vy = 0; L.firing = false;
      const base = 50 * pad.mult;
      const fuelBonus = Math.round(L.fuel * 2);
      const soft = vy < 0.8 ? 50 : 0;
      const pts = Math.round((base + fuelBonus + soft) * world.bonus);
      score += pts;
      lastResult = { pad, pts, base, fuelBonus, soft, ...stats };
      setMode('landed');
    } else {
      const reasons = [];
      if (hullHit && !footHit) reasons.push('hull struck terrain');
      if (!pad) reasons.push('touched down off a pad');
      if (vy > SAFE_VY) reasons.push(`descending at ${vy.toFixed(1)} m/s (limit ${SAFE_VY})`);
      if (vx > SAFE_VX) reasons.push(`drifting at ${vx.toFixed(1)} m/s (limit ${SAFE_VX})`);
      if (angDeg > SAFE_ANG) reasons.push(`tilted ${angDeg.toFixed(0)}° (limit ${SAFE_ANG}°)`);
      explode();
      lives--;
      lastResult = { reasons, ...stats };
      setMode(lives > 0 ? 'crashed' : 'over');
    }
  }

  // ---- World selection ----
  function selectWorld(w) {
    world = w;
    store.set('ds-world', w.id);
    level = 1;
    genTerrain();
    makeBackdrop();
    if (mode === 'title') setMode('title');
  }
  const effectText = w => {
    const bits = [];
    if (w.drag >= 0.2) bits.push('thick air');
    else if (w.drag > 0) bits.push('thin air');
    if (w.wind >= 1) bits.push('strong wind');
    else if (w.wind > 0) bits.push('light wind');
    return bits.length ? bits.join(', ') : 'no atmosphere';
  };

  // ---- Screens ----
  function setMode(m) {
    mode = m;
    keys.left = keys.right = keys.thrust = false;
    document.querySelectorAll('.pad button').forEach(b => b.classList.remove('held'));
    if (m === 'flying') { overlay.hidden = true; return; }
    overlay.hidden = false;
    const limits = `<p class="limits">Safe touchdown: vertical under ${SAFE_VY} m/s · horizontal under ${SAFE_VX} m/s · tilt under ${SAFE_ANG}°</p>`;
    let html = '';
    if (m === 'title') {
      const best = bestFor(world);
      html = `<h1 class="good">Descent Systems</h1>
        <p>Pick a world, then set the lander down on a flat pad before the tank runs dry. Narrow pads pay more: <b>×5</b>, <b>×3</b>, <b>×2</b>.</p>
        <div class="worlds" role="group" aria-label="Choose a world">
          ${WORLDS.map(w => `<button class="world" data-id="${w.id}" aria-pressed="${w === world}">
            <i class="orb" style="background:${w.orb}"></i><b>${w.name}</b><span>${w.g.toFixed(2)} m/s²</span>
          </button>`).join('')}
        </div>
        <p>${world.note}</p>
        <div class="brief">
          <span>Gravity <b>${world.g.toFixed(2)} m/s²</b></span>
          <span>${(world.g / 9.81).toFixed(2)} g</span>
          <span>Air <b>${effectText(world)}</b></span>
          <span>Score <b>×${world.bonus}</b></span>
        </div>
        <button class="btn" id="go">Descend to ${world.name}</button>
        <p class="keys-hint limits"><kbd>↑</kbd>/<kbd>W</kbd> thrust · <kbd>←</kbd><kbd>→</kbd>/<kbd>A</kbd><kbd>D</kbd> rotate · <kbd>←</kbd><kbd>→</kbd> on this screen switch world · <kbd>Space</kbd> start</p>
        ${limits}
        ${best ? `<p class="limits">Best on ${world.name}: ${best}</p>` : ''}`;
    } else if (m === 'landed') {
      const r = lastResult;
      html = `<h1 class="good">Contact on ${world.name}</h1>
        <p>×${r.pad.mult} pad · ${r.base} pts + fuel bonus ${r.fuelBonus}${r.soft ? ' + soft landing 50' : ''}${world.bonus !== 1 ? ` × ${world.bonus} world bonus` : ''} = <b>${r.pts}</b></p>
        <p class="limits">Touchdown at ${r.vy.toFixed(2)} m/s vertical, ${r.vx.toFixed(2)} m/s horizontal, ${r.ang.toFixed(1)}° tilt</p>
        <button class="btn" id="go">Next site</button>`;
    } else if (m === 'crashed') {
      html = `<h1 class="bad">Lander lost</h1>
        <p>${cap(lastResult.reasons.join(', '))}.</p>
        ${limits}
        <p>${lives} lander${lives === 1 ? '' : 's'} remaining.</p>
        <button class="btn" id="go">Try again</button>`;
    } else if (m === 'over') {
      const prev = bestFor(world), isBest = score > prev;
      if (isBest) store.set('ds-best-' + world.id, score);
      html = `<h1 class="bad">Mission over</h1>
        <p>${cap(lastResult.reasons.join(', '))}.</p>
        <p>Final score <b>${score}</b> on ${world.name}, reaching site ${level}.${isBest ? ' New best for this world.' : ` Best: ${prev}.`}</p>
        <div class="btns">
          <button class="btn" id="go">Fly ${world.name} again</button>
          <button class="btn ghost" id="pick">Choose another world</button>
        </div>`;
    }
    card.innerHTML = html;
    const go = $('go');
    go.addEventListener('click', advance);
    const pick = $('pick');
    if (pick) pick.addEventListener('click', () => { genTerrain(); spawn(); setMode('title'); });
    card.querySelectorAll('.world').forEach(b => b.addEventListener('click', () => {
      selectWorld(WORLDS.find(w => w.id === b.dataset.id));
      const again = card.querySelector(`.world[data-id="${b.dataset.id}"]`);
      if (again) again.focus({ preventScroll: true });
    }));
    if (m !== 'title') setTimeout(() => go.focus({ preventScroll: true }), 0);
  }
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

  function advance() {
    if (mode === 'title' || mode === 'over') {
      level = 1; lives = 3; score = 0; levelFuel = 100;
      genTerrain(); spawn();
    } else if (mode === 'landed') {
      level++; levelFuel = Math.max(45, 100 - (level - 1) * 8);
      genTerrain(); spawn();
    } else if (mode === 'crashed') {
      spawn();
    } else return;
    setMode('flying');
  }

  // ---- Rendering ----
  let scale = 1, offX = 0, offY = 0, cw = 0, ch = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cw = stage.clientWidth; ch = stage.clientHeight;
    canvas.width = cw * dpr; canvas.height = ch * dpr;
    scale = Math.min(cw / W, ch / H);
    offX = (cw - W * scale) / 2;
    offY = (ch - H * scale) / 2;
    makeBackdrop();
  }
  function makeBackdrop() {
    stars = Array.from({ length: Math.round(cw * ch / 2500) }, () => ({
      x: Math.random() * cw, y: Math.random() * ch * 0.8, r: Math.random() < 0.1 ? 1.4 : 0.8, t: Math.random() * 6
    }));
    dust = world.wind ? Array.from({ length: 50 }, () => ({
      x: rand(0, W), y: rand(5, H * 0.7), v: rand(-1, 1), ph: rand(0, 6), r: rand(0.25, 0.6)
    })) : [];
  }
  const sx = x => offX + x * scale;
  const sy = y => offY + (H - y) * scale;

  const css = getComputedStyle(document.documentElement);
  const C = n => css.getPropertyValue(n).trim();
  const col = {
    reg: C('--regolith'), flame: C('--flame'), bad: C('--bad'), space: C('--space')
  };

  function draw(time) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const sky = ctx.createLinearGradient(0, 0, 0, ch);
    sky.addColorStop(0, world.sky[0]); sky.addColorStop(1, world.sky[1]);
    ctx.fillStyle = sky; ctx.fillRect(0, 0, cw, ch);

    if (world.stars) {
      for (const s of stars) {
        ctx.globalAlpha = world.stars * (0.35 + 0.35 * Math.sin(time / 900 + s.t));
        ctx.fillStyle = col.reg;
        ctx.fillRect(s.x, s.y, s.r, s.r);
      }
      ctx.globalAlpha = 1;
    }

    // wind-blown dust motes
    if (dust.length) {
      ctx.fillStyle = world.rim;
      for (const d of dust) {
        ctx.globalAlpha = 0.25;
        const len = Math.max(1, Math.abs(windNow) * 1.2) * scale;
        ctx.fillRect(sx(d.x), sy(d.y), windNow >= 0 ? -len : len, Math.max(1, d.r * scale * 0.5));
      }
      ctx.globalAlpha = 1;
    }

    if (terrain.length) {
      ctx.beginPath();
      ctx.moveTo(sx(0), ch);
      for (const [x, y] of terrain) ctx.lineTo(sx(x), sy(y));
      ctx.lineTo(sx(W), ch); ctx.closePath();
      ctx.fillStyle = world.ground; ctx.fill();
      ctx.beginPath();
      terrain.forEach(([x, y], i) => i ? ctx.lineTo(sx(x), sy(y)) : ctx.moveTo(sx(x), sy(y)));
      ctx.strokeStyle = world.rim; ctx.lineWidth = 1.5; ctx.stroke();

      ctx.font = `600 ${Math.max(10, scale * 3.2)}px ${C('--f-mono')}`;
      ctx.textAlign = 'center';
      for (const p of pads) {
        ctx.strokeStyle = col.flame; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(sx(p.x1), sy(p.y)); ctx.lineTo(sx(p.x2), sy(p.y)); ctx.stroke();
        ctx.fillStyle = col.flame;
        ctx.fillText(`×${p.mult}`, sx((p.x1 + p.x2) / 2), sy(p.y) + Math.max(14, scale * 4.5));
      }
    }

    for (const p of particles) {
      const k = Math.max(0, p.life / p.max);
      ctx.globalAlpha = Math.min(1, k * 1.6);
      ctx.fillStyle = p.kind === 'fire' ? (k > 0.5 ? col.flame : col.bad) : col.reg;
      const r = (p.kind === 'fire' ? 0.5 + k * 0.6 : 0.6) * scale;
      ctx.fillRect(sx(p.x) - r / 2, sy(p.y) - r / 2, r, r);
    }
    ctx.globalAlpha = 1;

    if (mode === 'flying' || mode === 'landed') drawLander(lander);
    if (mode === 'title') drawLander({ x: W / 2, y: H * 0.62, a: Math.sin(time / 1400) * 0.15, firing: true });
  }

  function drawLander(L) {
    ctx.save();
    ctx.translate(sx(L.x), sy(L.y));
    ctx.rotate(L.a);
    ctx.scale(scale, scale);
    ctx.lineWidth = 1.9 / scale;
    ctx.lineJoin = 'round';
    if (L.firing) {
      const len = 3 + Math.random() * 2.5;
      ctx.beginPath();
      ctx.moveTo(-0.9, 1.3); ctx.lineTo(0, 1.3 + len); ctx.lineTo(0.9, 1.3); ctx.closePath();
      ctx.fillStyle = col.flame; ctx.fill();
    }
    ctx.strokeStyle = col.reg;
    ctx.fillStyle = col.space;
    ctx.beginPath();
    ctx.moveTo(-1.8, -0.5); ctx.lineTo(-2.2, -2.6); ctx.lineTo(-1, -3.8); ctx.lineTo(1, -3.8);
    ctx.lineTo(2.2, -2.6); ctx.lineTo(1.8, -0.5); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-0.9, -2.9); ctx.lineTo(0, -3.3); ctx.lineTo(0.9, -2.9); ctx.stroke();
    ctx.fillRect(-2.6, -0.5, 5.2, 1.5); ctx.strokeRect(-2.6, -0.5, 5.2, 1.5);
    ctx.beginPath(); ctx.moveTo(-0.6, 1); ctx.lineTo(-0.9, 1.4); ctx.lineTo(0.9, 1.4); ctx.lineTo(0.6, 1); ctx.stroke();
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(s * 2.2, 0.8); ctx.lineTo(s * 3.4, 3);
      ctx.moveTo(s * 1.4, 1); ctx.lineTo(s * 3.4, 3);
      ctx.moveTo(s * 2.8, 3); ctx.lineTo(s * 4, 3);
      ctx.stroke();
    }
    ctx.restore();

    if (L === lander && L.y > H + 2) {
      ctx.fillStyle = col.flame;
      ctx.beginPath();
      const x = sx(L.x), y = Math.max(8, offY + 6);
      ctx.moveTo(x, y - 6); ctx.lineTo(x - 6, y + 4); ctx.lineTo(x + 6, y + 4); ctx.fill();
    }
  }

  // ---- HUD ----
  const hud = {
    alt: $('alt'), vx: $('vx'), vy: $('vy'), ang: $('ang'), wind: $('wind'), windRow: $('windRow'),
    fuelTxt: $('fuelTxt'), fuelBar: $('fuelBar'), score: $('score'), meta: $('meta')
  };
  const grade = (v, lim) => v <= lim ? 'ok' : v <= lim * 2 ? 'warn' : 'bad';
  function updateHud() {
    const L = lander;
    if (!L) return;
    const alt = Math.max(0, L.y - 3 - groundAt(L.x));
    const vy = -L.vy, vx = Math.abs(L.vx), ang = L.a * 180 / Math.PI;
    hud.alt.textContent = `${alt.toFixed(1)} m`;
    hud.vx.textContent = `${L.vx >= 0 ? '→' : '←'} ${vx.toFixed(1)} m/s`;
    hud.vy.textContent = `${vy >= 0 ? '↓' : '↑'} ${Math.abs(vy).toFixed(1)} m/s`;
    hud.ang.textContent = `${ang.toFixed(0)}°`;
    hud.vx.className = grade(vx, SAFE_VX);
    hud.vy.className = vy < 0 ? 'ok' : grade(vy, SAFE_VY);
    hud.ang.className = grade(Math.abs(ang), SAFE_ANG);
    hud.windRow.hidden = !world.wind;
    if (world.wind) {
      hud.wind.textContent = `${windNow >= 0 ? '→' : '←'} ${Math.abs(windNow).toFixed(1)} m/s²`;
      hud.wind.className = Math.abs(windNow) > world.wind * 0.8 ? 'warn' : '';
    }
    hud.fuelTxt.textContent = `${Math.ceil(L.fuel)} kg`;
    hud.fuelTxt.className = L.fuel > 25 ? '' : L.fuel > 0 ? 'warn' : 'bad';
    hud.fuelBar.style.width = `${L.fuel}%`;
    hud.score.textContent = score;
    hud.meta.textContent = `${world.name.toUpperCase()} · SITE ${level} · LANDERS ${lives}`;
  }

  // ---- Loop ----
  let last = performance.now(), acc = 0;
  const DT = 1 / 120;
  function frame(now) {
    acc += Math.min(0.1, (now - last) / 1000);
    last = now;
    while (acc >= DT) { step(DT); acc -= DT; }
    draw(now);
    updateHud();
    requestAnimationFrame(frame);
  }

  // ---- Input ----
  const keyMap = {
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right',
    ArrowUp: 'thrust', KeyW: 'thrust'
  };
  addEventListener('keydown', e => {
    const k = keyMap[e.code];
    if (mode === 'title' && (k === 'left' || k === 'right')) {
      e.preventDefault();
      if (e.repeat) return;
      const i = WORLDS.indexOf(world) + (k === 'left' ? -1 : 1);
      selectWorld(WORLDS[(i + WORLDS.length) % WORLDS.length]);
      return;
    }
    if (k) { keys[k] = mode === 'flying'; e.preventDefault(); }
    else if (e.code === 'Space' && mode !== 'flying') { e.preventDefault(); advance(); }
    else if (e.code === 'Enter' && mode !== 'flying' && !document.activeElement.classList.contains('world')) { e.preventDefault(); advance(); }
    else if (e.code === 'Space') e.preventDefault();
  });
  addEventListener('keyup', e => { const k = keyMap[e.code]; if (k) keys[k] = false; });
  addEventListener('blur', () => { keys.left = keys.right = keys.thrust = false; });

  [['bl', 'left'], ['bt', 'thrust'], ['br', 'right']].forEach(([id, k]) => {
    const b = $(id);
    const on = e => { e.preventDefault(); if (mode !== 'flying') return; keys[k] = true; b.classList.add('held'); try { b.setPointerCapture(e.pointerId); } catch (_) {} };
    const off = () => { keys[k] = false; b.classList.remove('held'); };
    b.addEventListener('pointerdown', on);
    b.addEventListener('pointerup', off);
    b.addEventListener('pointercancel', off);
    b.addEventListener('lostpointercapture', off);
    b.addEventListener('contextmenu', e => e.preventDefault());
  });

  new ResizeObserver(resize).observe(stage);
  resize();
  genTerrain();
  spawn();
  setMode('title');
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
