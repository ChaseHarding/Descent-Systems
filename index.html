<style>
/* Layout: one full-height stage — canvas fills it, instrument HUD pinned top-left, touch pad below on phones.
   Each world brings its own sky/ground colors into the canvas; the HUD chrome stays constant. */
:root {
  --space: #0a0e1c;
  --space-2: #121a33;
  --regolith: #c9cfdc;
  --regolith-dim: #6c7690;
  --flame: #ffb547;
  --ok: #9fe0b8;
  --warn: #ffb547;
  --bad: #ff6b5e;
  --panel: rgba(10, 14, 28, 0.78);
  --f-display: "Chakra Petch", "Trebuchet MS", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--space);
  color: var(--regolith);
  font-family: var(--f-mono);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  touch-action: none;
}
.app {
  height: 100%;
  display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(12px, env(safe-area-inset-top, 0px));
  padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
  gap: 10px;
  box-sizing: border-box;
}
.stage {
  position: relative; flex: 1; min-height: 0;
  border: 1px solid var(--space-2);
  border-radius: 6px;
  overflow: hidden;
  background: var(--space);
}
canvas { display: block; width: 100%; height: 100%; }

.hud {
  position: absolute; top: 10px; left: 10px;
  display: grid; grid-template-columns: auto auto; column-gap: 14px; row-gap: 2px;
  padding: 10px 12px; margin: 0;
  background: var(--panel);
  border: 1px solid var(--space-2);
  border-radius: 4px;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  pointer-events: none;
}
.hud .row { display: contents; }
.hud dt { color: var(--regolith-dim); letter-spacing: 0.08em; }
.hud dd { margin: 0; text-align: right; min-width: 7ch; }
.hud dd.ok { color: var(--ok); }
.hud dd.warn { color: var(--warn); }
.hud dd.bad { color: var(--bad); }
.fuel { grid-column: 1 / -1; height: 5px; background: var(--space-2); margin-top: 6px; border-radius: 2px; overflow: hidden; }
.fuel i { display: block; height: 100%; background: var(--flame); width: 100%; }

.score {
  position: absolute; top: 10px; right: 10px;
  text-align: right; font-size: 12px; pointer-events: none;
  font-variant-numeric: tabular-nums;
  padding: 6px 10px; background: var(--panel); border-radius: 4px;
}
.score b { display: block; font-family: var(--f-display); font-size: 22px; font-weight: 700; color: var(--regolith); }
.score span { color: var(--regolith-dim); letter-spacing: 0.08em; }

.overlay {
  position: absolute; inset: 0;
  display: flex;
  background: rgba(10, 14, 28, 0.6);
  padding: 16px;
  overflow-y: auto;
}
.card {
  max-width: 40rem; width: 100%; margin: auto; text-align: center;
  display: flex; flex-direction: column; gap: 12px; align-items: center;
}
.card h1 {
  font-family: var(--f-display); font-weight: 700;
  font-size: clamp(28px, 6vw, 52px); letter-spacing: 0.04em;
  margin: 0; text-wrap: balance; text-transform: uppercase; line-height: 1.05;
}
.card h1.bad { color: var(--bad); }
.card h1.good { color: var(--flame); }
.card p { margin: 0; line-height: 1.6; font-size: 13px; color: var(--regolith); text-wrap: pretty; }
.card .limits { color: var(--regolith-dim); font-size: 12px; }
kbd {
  font-family: var(--f-mono); font-size: 11px;
  border: 1px solid var(--regolith-dim); border-radius: 3px; padding: 1px 5px;
}
.btn {
  font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--space); background: var(--flame);
  border: 0; border-radius: 4px; padding: 10px 22px; cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--regolith); border: 1px solid var(--regolith-dim); }
.btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.btn:focus-visible, .pad button:focus-visible, .world:focus-visible { outline: 2px solid var(--regolith); outline-offset: 3px; }

/* World picker */
.worlds { width: 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 96px)); justify-content: center; gap: 8px; }
.world {
  width: 100%; box-sizing: border-box; min-width: 0; padding: 10px 6px 8px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  background: var(--panel); color: var(--regolith);
  border: 1px solid var(--space-2); border-radius: 6px; cursor: pointer;
  font-family: var(--f-mono); font-size: 11px;
}
.world .orb { width: 30px; height: 30px; border-radius: 50%; box-shadow: inset -6px -5px 0 rgba(0,0,0,0.35); }
.world b { font-family: var(--f-display); font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase; }
.world span { color: var(--regolith-dim); font-variant-numeric: tabular-nums; }
.world[aria-pressed="true"] { border-color: var(--flame); }
.world[aria-pressed="true"] b { color: var(--flame); }
.brief {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px;
  font-size: 12px; color: var(--regolith-dim); font-variant-numeric: tabular-nums;
}
.brief b { color: var(--regolith); font-weight: 500; }

/* Hangar */
.card .balance { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: 0.08em; color: var(--flame); font-variant-numeric: tabular-nums; }
.preview { display: block; width: 100%; max-width: 320px; aspect-ratio: 3 / 2; border: 1px solid var(--space-2); border-radius: 6px; }
/* Hangar: the garage on the left, the shelves on the right */
.card.wide { max-width: 58rem; }
.hangar { width: 100%; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.hangar .top { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.bay { width: 100%; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 16px; align-items: start; text-align: left; }
.bay .col { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.garage { display: block; width: 100%; aspect-ratio: 4 / 3; border: 1px solid var(--space-2); border-radius: 8px; background: var(--space); }
.hangar .radio.quote { max-width: none; padding: 8px 10px; }
.hangar .radio .face { width: 44px; height: 44px; }
.card .hangar .radio p { font-size: 13px; min-height: 2.6em; }
.look { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--space-2); border-radius: 8px; font-size: 12px; }
.look h3 { margin: 0; font-family: var(--f-display); font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--regolith-dim); }
.look .row { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.look .row .k { color: var(--regolith-dim); text-transform: uppercase; font-size: 10px; letter-spacing: 0.1em; }
.look .row .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.look .row .v { font-variant-numeric: tabular-nums; color: var(--regolith-dim); }
.look .row .v.ok { color: var(--ok); }
.look .row .v.lock { color: var(--bad); }
.look .total { display: flex; justify-content: space-between; border-top: 1px solid var(--space-2); padding-top: 6px; font-weight: 500; }
.look .btns { justify-content: flex-start; }
.look .btn { padding: 8px 14px; font-size: 12px; }
.tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: var(--space); border: 1px solid var(--space-2); border-radius: 8px; }
.tabs button { padding: 8px 4px; border: 0; border-radius: 5px; background: none; color: var(--regolith-dim); cursor: pointer; font-family: var(--f-display); font-weight: 700; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
.tabs button[aria-selected="true"] { background: var(--space-2); color: var(--flame); }
.tabs button:focus-visible { outline: 2px solid var(--flame); outline-offset: 1px; }
.tabs small { font-family: var(--f-mono); font-weight: 400; letter-spacing: 0; color: var(--regolith-dim); }
.bay .items { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.item .sw.big { height: 22px; }
.item.locked { opacity: 0.75; }
.item.locked span { color: var(--regolith-dim); }
.detail { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--space-2); border-radius: 8px; font-size: 12px; }
.detail b { font-family: var(--f-display); font-size: 16px; letter-spacing: 0.04em; }
.card .detail p { font-size: 12px; color: var(--regolith-dim); }
.detail .bar { display: block; height: 5px; background: var(--space-2); border-radius: 3px; overflow: hidden; }
.detail .bar i { display: block; height: 100%; background: var(--flame); }
.detail .btns { justify-content: flex-start; }
.detail .btn { padding: 8px 14px; font-size: 12px; }
.fleet { width: 100%; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 860px) { .fleet { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.ship { position: relative; min-width: 0; display: flex; flex-direction: column; gap: 6px; padding: 10px; text-align: left; cursor: pointer; background: var(--panel); color: var(--regolith); border: 1px solid var(--space-2); border-radius: 8px; font-family: var(--f-mono); }
.ship.sel { border-color: var(--flame); }
.ship.locked { opacity: 0.8; }
.ship canvas { width: 100%; aspect-ratio: 2 / 1; display: block; }
.ship b { font-family: var(--f-display); font-size: 15px; letter-spacing: 0.05em; text-transform: uppercase; }
.ship .by { font-size: 11px; color: var(--regolith-dim); }
.ship .st { font-size: 11px; color: var(--regolith-dim); }
.ship .st.fly { color: var(--ok); }
.ship .bars { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 8px; align-items: center; font-size: 10px; color: var(--regolith-dim); text-transform: uppercase; letter-spacing: 0.06em; }
.ship .bars span { display: flex; gap: 2px; }
.ship .bars i { flex: 1; height: 4px; border-radius: 1px; background: var(--space-2); }
.ship .bars i.on { background: var(--flame); }
.unlockbar { width: 100%; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--panel); border: 1px dashed var(--flame); border-radius: 8px; font-size: 12px; text-align: left; }
.unlockbar .btn { padding: 8px 14px; font-size: 12px; }
@media (max-width: 560px) { .fleet { gap: 6px; } .ship { padding: 7px; } .ship .bars { display: none; } .ship b { font-size: 12px; } }
.tabs.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.shop { display: flex; flex-direction: column; gap: 8px; }
.upg { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--space-2); border-radius: 8px; }
.upg .uh { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.upg b { font-family: var(--f-display); font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase; }
.upg .pips { display: flex; gap: 4px; }
.upg .pips i { width: 14px; height: 6px; border-radius: 2px; background: var(--space-2); }
.upg .pips i.on { background: var(--ok); }
.card .upg p { font-size: 12px; color: var(--regolith-dim); }
.card .upg p.now { color: var(--regolith); }
.upg .btn { align-self: flex-start; padding: 7px 12px; font-size: 12px; }
.shop .toggle { padding: 10px 12px; }
@media (max-width: 720px) {
  .bay { grid-template-columns: minmax(0, 1fr); }
  .garage { aspect-ratio: 16 / 9; }
}
.deal { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: center; font-size: 13px; }
.deal span { color: var(--regolith-dim); }
.deal b { color: var(--regolith); font-weight: 500; }
.shelf { width: 100%; display: flex; flex-direction: column; gap: 6px; }
.shelf h2 { margin: 0; font-family: var(--f-display); font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--regolith-dim); text-align: left; }
.items { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.item {
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0;
  padding: 8px; background: var(--panel); color: var(--regolith);
  border: 1px solid var(--space-2); border-radius: 6px; cursor: pointer;
  font-family: var(--f-mono); font-size: 11px; text-align: left;
}
.item .sw { display: block; width: 100%; height: 12px; border-radius: 3px; }
.item b { font-weight: 500; font-size: 12px; }
.item span { color: var(--regolith-dim); font-variant-numeric: tabular-nums; }
.item.owned span { color: var(--regolith); }
.item.equipped span { color: var(--ok); }
.item[aria-pressed="true"] { border-color: var(--flame); }
.item:focus-visible { outline: 2px solid var(--regolith); outline-offset: 2px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
/* Game mode + hot-seat */
.seg { display: inline-flex; border: 1px solid var(--regolith-dim); border-radius: 6px; overflow: hidden; }
.seg button {
  font-family: var(--f-display); font-weight: 700; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 8px 14px; background: transparent; color: var(--regolith-dim); border: 0; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--regolith); color: var(--space); }
.seg button:focus-visible { outline: 2px solid var(--flame); outline-offset: -2px; }
.names { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.names label { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--regolith-dim); }
.names input {
  width: 10rem; max-width: 60vw; box-sizing: border-box;
  font-family: var(--f-mono); font-size: 13px; padding: 7px 9px;
  background: var(--panel); color: var(--regolith);
  border: 1px solid var(--space-2); border-radius: 4px;
  -webkit-user-select: text; user-select: text;
}
.names input:focus-visible { outline: 2px solid var(--flame); outline-offset: 1px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.tally-wrap { max-width: 100%; overflow-x: auto; }
.tally { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; min-width: 16rem; }
.tally th, .tally td { padding: 5px 12px; text-align: right; border-bottom: 1px solid var(--space-2); }
.tally th { font-weight: 500; }
.tally th:first-child, .tally td:first-child { text-align: left; color: var(--regolith-dim); }
.tally tfoot td { font-weight: 500; color: var(--regolith); border-bottom: 0; }
.tally .crash { color: var(--bad); }
.corner {
  position: absolute; z-index: 6;
  right: 10px; bottom: 10px;
  display: flex; gap: 6px;
}
.mute {
  font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 6px 10px; cursor: pointer;
  background: var(--panel); color: var(--regolith);
  border: 1px solid var(--space-2); border-radius: 4px;
}
.mute[aria-pressed="true"] { color: var(--regolith-dim); }
.mute:focus-visible { outline: 2px solid var(--regolith); outline-offset: 2px; }
/* Daily challenge */
.daily {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 12px 18px; background: var(--panel);
  border: 1px solid var(--flame); border-radius: 6px;
  font-size: 12px; color: var(--regolith-dim); max-width: 30rem;
}
.daily .eyebrow { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
.daily > b { font-family: var(--f-display); font-size: 24px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--flame); }
.daily span b { color: var(--regolith); font-weight: 500; }
.card .squares { font-size: 26px; letter-spacing: 0.15em; line-height: 1.2; color: var(--flame); }
.share-text {
  width: min(24rem, 100%); box-sizing: border-box; resize: none;
  font-family: var(--f-mono); font-size: 12px; padding: 8px;
  background: var(--panel); color: var(--regolith); border: 1px solid var(--space-2); border-radius: 4px;
  -webkit-user-select: text; user-select: text;
}
/* Badges */
.badges { width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 560px) { .badges { grid-template-columns: minmax(0, 1fr); } }
.badge {
  display: flex; gap: 12px; align-items: flex-start; min-width: 0;
  padding: 10px 12px; text-align: left;
  background: var(--panel); border: 1px solid var(--space-2); border-radius: 6px;
}
.badge > div { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
.badge b { font-family: var(--f-display); font-size: 14px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--regolith-dim); }
.badge span { font-size: 11px; color: var(--regolith-dim); line-height: 1.45; }
.badge .reward { color: var(--regolith); }
.badge.got { border-color: var(--flame); }
.badge.got b { color: var(--flame); }
.badge.got span { color: var(--regolith); }
.badge.got .reward { color: var(--ok); }
.medal {
  flex: none; width: 26px; height: 26px; margin-top: 2px; border-radius: 50%;
  border: 2px solid var(--regolith-dim); box-sizing: border-box;
}
.badge.got .medal { border-color: var(--flame); background: radial-gradient(circle, var(--flame) 45%, transparent 50%); }
.bar { display: block; height: 4px; margin-top: 3px; background: var(--space-2); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--flame); }
.card .sub { color: var(--regolith-dim); }
.achv {
  position: absolute; z-index: 7; left: 50%; top: 12px; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 16px; min-width: 14rem; max-width: calc(100% - 32px); box-sizing: border-box;
  background: var(--space); border: 1px solid var(--flame); border-radius: 6px;
  text-align: center; pointer-events: none;
}
.achv span { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--regolith-dim); }
.achv b { font-family: var(--f-display); font-size: 17px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--flame); }
.achv small { font-size: 11px; color: var(--regolith); }
@media (prefers-reduced-motion: no-preference) {
  .achv:not([hidden]) { animation: achv-in 0.25s ease-out; }
  @keyframes achv-in { from { transform: translate(-50%, -8px); opacity: 0; } }
}
/* Missions */
.mlist { width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 560px) { .mlist { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.mtile {
  position: relative; min-width: 0;
  display: flex; flex-direction: column; align-items: flex-start; gap: 3px;

        const x = rrand(12, W - 12);
        if (pads.some(p => x > p.x1 - 9 && x < p.x2 + 9) || vents.some(v => Math.abs(v.x - x) < 25)) continue;
        const period = rrand(5, 8);
        vents.push({ x, period, phase: rrand(0, period), was: false });
      }
    }
  }
  // ---- Moving pads: a rover driving back and forth along a flat track, or a barge rocking on the sea ----
  // Their position is a smooth function of time, so the daily challenge and hot-seat stay the same for everyone.
  const MOVER_WORLDS = ['pluto', 'vesta', 'moon', 'ganymede', 'titan', 'mercury', 'mars', 'earth'];
  function updateMovers() {
    for (const p of pads) {
      const m = p.move;
      if (!m) continue;
      const t = p.parkT != null ? p.parkT : simT;
      const run = m.hi - m.lo - m.w, om = 2 * m.speed / run, ph = om * t + (m.phase || 0);   // top speed m.speed in the middle of the track
      p.x1 = m.lo + run * (0.5 - 0.5 * Math.cos(ph)); p.x2 = p.x1 + m.w;
      p.vx = p.parkT != null ? 0 : run * 0.5 * Math.sin(ph) * om;
      if (p.kind === 'barge') {
        p.y = m.y0 + 0.3 * Math.sin(t * 1.4);
        p.vy = p.parkT != null ? 0 : 0.42 * Math.cos(t * 1.4);
      } else p.vy = 0;
    }
  }
  // the highest thing under x: the ground, or a rover or barge deck
  function surfaceAt(x) {
    let y = groundAt(x);
    for (const p of pads) if (p.move && x >= p.x1 && x <= p.x2 && p.y > y) y = p.y;
    return y;
  }
  // ---- Meteor showers on airless worlds ----
  // Each meteor's impact time and spot are set when the site is built (from rng), so daily and hot-seat
  // pilots face the same shower. A red marker and a dotted track show where one will land before it arrives.
  const METEOR_WORLDS = ['pluto', 'moon', 'vesta', 'mercury'];
  const METEOR_V = 42, METEOR_WARN = 2.0;
  function planMeteors(gapLo, gapHi, start = 4, until = 150) {
    const list = [];
    for (let t = start + rrand(0, gapHi); t < until; t += rrand(gapLo, gapHi)) {
      const ang = rrand(0.45, 0.85), dir = rng() < 0.5 ? -1 : 1;
      list.push({ t, x: rrand(6, W - 6), ang, dir });
    }
    return list;
  }
  const meteorFall = m => (H + 20 - groundAt(m.x)) / (METEOR_V * Math.cos(m.ang));   // seconds from sky to ground
  function meteorPos(m, tau) {   // tau: seconds until impact
    const d = METEOR_V * tau;
    return [m.x - m.dir * Math.sin(m.ang) * d, groundAt(m.x) + Math.cos(m.ang) * d];
  }
  function meteorTick() {
    for (const m of meteors) {
      if (m.done) continue;
      const tau = m.t - simT;
      if (tau <= 0) {
        m.done = true;
        const gy = groundAt(m.x);
        spawnDust(m.x, gy, 20, 1.6);
        for (let k = 0; k < 22; k++) particles.push({ x: m.x, y: gy + 0.5, vx: rand(-9, 9), vy: rand(3, 13), g: world.g * 2 + 2, life: rand(0.5, 1.3), max: 1.3, kind: 'blast' });
        if (lander && Math.abs(lander.x - m.x) < 40) addShake(3);
        if (mode === 'flying') sfx.impact(lander ? Math.abs(lander.x - m.x) : 99);
        continue;
      }
      if (mode === 'flying' && lander && !lander.grounded && tau < meteorFall(m)) {
        const [mx, my] = meteorPos(m, tau);
        if (Math.hypot(mx - lander.x, my - (lander.y - 0.5)) < 3.3) lander.meteorHit = true;
      }
    }
  }
  const ERUPT = 2.2, WARN = 1.6, PLUME_H = 42;
  // Mercury: sunlight boils fuel away except in shadow. Vesta: spin pushes outward. Ganymede: magnetic storms come and go.
  const BOIL = 0.9, SPIN = 0.001, STORM_P = 14;
  const inShade = x => shades.some(([a, b]) => x >= a && x <= b);
  function stormState() {
    if (world.hazard !== 'storm') return {};
    if (mission && mission.def.storm === 'always') return { on: true };
    const t = (simT + stormSeed) % STORM_P;
    if (t >= 9 && t < 13.5) return { on: true };
    if (t >= 6.5 && t < 9) return { warn: true, left: 9 - t };
    return {};
  }
  function ventState(v) {
    const t = (simT + v.phase) % v.period;
    if (t < ERUPT) return { on: true, k: t / ERUPT };
    if (t > v.period - WARN) return { warn: true };
    return {};
  }
  function plumeTop(v, st) {
    const k = st.k, f = k < 0.15 ? k / 0.15 : k > 0.8 ? (1 - k) / 0.2 : 1;
    return groundAt(v.x) + PLUME_H * f;
  }
  function groundAt(x) {
    const T = terrain;
    if (x <= T[0][0]) return T[0][1];
    for (let i = 0; i < T.length - 1; i++) {
      const [x0, y0] = T[i], [x1, y1] = T[i + 1];
      if (x <= x1) return x1 > x0 ? y0 + (y1 - y0) * (x - x0) / (x1 - x0) : y1;
    }
    return T[T.length - 1][1];
  }
  // Rock hanging from above (canyon roofs). Infinity where the sky is open.
  function ceilingAt(x) {
    let best = Infinity;
    for (const c of ceilings) {
      if (x < c[0][0] || x > c[c.length - 1][0]) continue;
      for (let i = 0; i < c.length - 1; i++) {
        const [x0, y0] = c[i], [x1, y1] = c[i + 1];
        if (x <= x1) { const y = x1 > x0 ? y0 + (y1 - y0) * (x - x0) / (x1 - x0) : y1; if (y < best) best = y; break; }
      }
    }
    return best;
  }
  // Gusting wind: a steady breeze plus two slow waves, occasionally reversing on stormy worlds.
  function windAt(t) {
    if (!world.wind) return 0;
    const shield = perk('shield') ? 0.5 : 1;
    const s = t + windSeed;
    const gust = 0.55 + 0.35 * Math.sin(s * 0.45) + 0.25 * Math.sin(s * 1.6 + 1.3);
    return world.wind * windDir * gust * (mission && mission.def.windMul || 1) * shield;
  }

  // ---- Lander ----
  function spawn(plan) {
    spawnPlan = plan || { x: rrand(W * 0.2, W * 0.8), vx: rrand(-4, 4) };
    flagPlant = null;
    flightT = 0; simT = 0; recording = [];
    for (const p of pads) delete p.parkT;   // a new attempt: the rover is back on the move
    for (const m of meteors) m.done = false;
    lander = {
      x: spawnPlan.x, y: spawnPlan.y ?? H - 12,
      vx: spawnPlan.vx, vy: spawnPlan.vy ?? 0, a: 0,
      fuel: levelFuel * tankMul() * (run ? 1 : ship().tank), fuelMax: levelFuel * tankMul() * (run ? 1 : ship().tank), firing: false,
      grounded: false, cargo: false, crew: false
    };
    particles = [];
    resetCamera();
  }
  function toWorld(lx, ly, L = lander) {
    const c = Math.cos(L.a), s = Math.sin(L.a);
    return [L.x + lx * c + ly * s, L.y - lx * s + ly * c];
  }

  // ---- Simulation ----
  function step(dt) {
    simT += dt;
    updateMovers();
    windNow = windAt(simT);
    const L = lander;
    if (mode === 'flying') {
      let rot = 0;
      if (keys.left) rot -= 1;
      if (keys.right) rot += 1;
      if (rot && L.fuel > 0 && !L.grounded) {
        const na = L.a + rot * ROT_RATE * rotMul() * ship().rot * (perk('gyro') ? 1.3 : 1) * dt;
        L.a = fullSpin ? Math.atan2(Math.sin(na), Math.cos(na))          // wrap to ±180°
                       : Math.max(-Math.PI / 2, Math.min(Math.PI / 2, na));
        if (!perk('gyro') && !ship().freeRcs) L.fuel = Math.max(0, L.fuel - RCS_BURN * dt);
      }
      L.firing = keys.thrust && L.fuel > 0;
      let ax = windNow * ship().wind - world.drag * L.vx;
      let ay = -world.g - world.drag * L.vy;
      if (L.firing) {
        const T = world.thrust * thrustMul() * ship().thrust;
        ax += Math.sin(L.a) * T;
        ay += Math.cos(L.a) * T;
        L.fuel = Math.max(0, L.fuel - BURN * burnMul() * dt);
        if (Math.random() < 0.9) emitExhaust();
        const wash = L.y - 3 - groundAt(L.x);
        if (wash < 10 && Math.random() < 0.5) spawnDust(L.x + Math.sin(L.a) * -wash, groundAt(L.x), 1, 1.2 - wash / 10);
      }
      if (world.hazard === 'spin' && !L.grounded) ax += (L.x - W / 2) * SPIN;
      if (world.hazard === 'heat' && !inShade(L.x) && L.fuel > 0 && !tut) L.fuel = Math.max(0, L.fuel - BOIL * dt);
      if (world.hazard === 'storm') {
        const st = stormState();
        if (st.on && !stormWas) { sfx.static(); if (!(mission && mission.def.storm)) showToast('Magnetic storm! Instruments scrambled', 1600); }
        if (st.warn && !stormWarned) { stormWarned = true; showToast('Magnetic storm incoming…', 1600); }
        if (!st.warn) stormWarned = false;
        stormWas = !!st.on;
      }
      if (world.hazard === 'geyser') {
        for (const v of vents) {
          const st = ventState(v);
          if (st.on && Math.abs(L.x - v.x) < 4.5 && L.y < plumeTop(v, st) + 4) {
            ay += 9 * (1 - Math.max(0, L.y - groundAt(v.x)) / (PLUME_H + 4));
          }
        }
      }
      if (tut) {
        if (L.firing) tut.burn += dt;
        tut.t += dt;
        if (tut.step === 0 && tut.burn > 0.8) nextTut();
        else if (tut.step === 1 && Math.abs(L.a) > 0.3) nextTut();
        else if (tut.step === 2 && tut.t > 5) nextTut();
        if (tut.step < 2) { ax = 0; ay = 0; L.vx = 0; L.vy = 0; }   // training hold: gravity switches on at step 3
      }
      if (L.grounded) {
        // resting on a pad: stay put until the engine can lift you
        if (L.firing && ay > 0) { L.grounded = false; L.y += 0.05; L.liftAt = simT; if (mission) mission.loading = false; }
        else { ax = 0; ay = 0; L.vx = 0; L.vy = 0; }
      }
      L.vx += ax * dt; L.vy += ay * dt;
      L.x += L.vx * dt; L.y += L.vy * dt;
      if (L.x < 4) { L.x = 4; L.vx = Math.abs(L.vx) * 0.3; }
      if (L.x > W - 4) { L.x = W - 4; L.vx = -Math.abs(L.vx) * 0.3; }
      if (meteors.length) { meteorTick(); if (L.meteorHit) { checkContact(); return; } }
      if (L.sling && slingStep(dt)) return;
      flightT += dt;
      const fi = Math.floor(flightT * 60);
      while (recording.length <= fi) recording.push(L.sling ? [L.x, L.y, L.a, L.firing ? 1 : 0, L.sling.x, L.sling.y] : [L.x, L.y, L.a, L.firing ? 1 : 0]);
      if (mission && missionTick(dt)) return;
      if (L.grounded && mission && mission.loading) {
        mission.loadT += dt;
        if (mission.loadT >= LOAD_TIME) finishPickup();
      }

      if (goal && goal.type === 'exit' && L.y > H + 4) completeMission(null);
      else checkContact();
    }
    for (const p of particles) {
      p.vy -= (p.g ?? 0) * dt;
      p.vx += windNow * 3 * dt - world.drag * 2 * p.vx * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.y < groundAt(p.x)) { p.y = groundAt(p.x); p.vy *= -0.3; p.vx *= 0.6; }
      p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);
    for (const v of vents) {
      const on = !!ventState(v).on;
      if (on && !v.was && mode === 'flying') {
        sfx.erupt(world.hazard === 'volcano');
        if (lander && Math.abs(lander.x - v.x) < 45) addShake(world.hazard === 'volcano' ? 4 : 2);
      }
      v.was = on;
    }
    for (const d of dust) {
      d.x += (windNow * 9 + d.v) * dt;
      d.y += Math.sin(simT * 2 + d.ph) * 0.6 * dt;
      if (d.x > W + 5) d.x -= W + 10;
      if (d.x < -5) d.x += W + 10;
    }
  }

  function emitExhaust(L = lander) {
    const [ex, ey] = toWorld(rand(-0.6, 0.6), -1.4, L);
    const spd = rand(10, 18);
    const dir = L.a + Math.PI + rand(-0.25, 0.25);
    particles.push({
      x: ex, y: ey,
      vx: Math.sin(dir) * spd + L.vx, vy: Math.cos(dir) * spd + L.vy,
      life: rand(0.25, 0.6), max: 0.6, kind: 'fire', hue: rand(0, 120)
    });
  }
  function spawnDust(x, y, n, power) {
    for (let i = 0; i < n; i++) {
      const dir = Math.random() < 0.5 ? -1 : 1;
      particles.push({
        x: x + rand(-2, 2), y: y + 0.2, vx: dir * rand(2, 7) * power, vy: rand(0.4, 2.2) * Math.min(power, 2),
        g: Math.max(0.4, world.g * 0.25), life: rand(0.7, 1.6), max: 1.6, kind: 'dust'
      });
    }
  }
  function explode() {
    const L = lander;
    for (let i = 0; i < 90; i++) {
      const a = rand(0, Math.PI * 2), s = rand(3, 22);
      particles.push({
        x: L.x, y: L.y + 1, vx: Math.cos(a) * s + L.vx * 0.3, vy: Math.abs(Math.sin(a)) * s,
        g: Math.max(3, world.g * 2), life: rand(0.8, 2.4), max: 2.4, kind: i % 3 ? 'blast' : 'debris'
      });
    }
  }

  function checkContact() {
    const L = lander;
    if (L.grounded) return;
    const feet = FEET.map(([x, y]) => toWorld(x, y));
    const hull = HULL.map(([x, y]) => toWorld(x, y));
    const hullHit = hull.some(([x, y]) => y <= groundAt(x));
    const footHit = feet.some(([x, y]) => y <= groundAt(x) || pads.some(p => p.move && x >= p.x1 && x <= p.x2 && y <= p.y));
    const roofHit = ceilings.length > 0 && [...hull, ...feet].some(([x, y]) => y >= ceilingAt(x));
    const lavaHit = world.hazard === 'volcano' && vents.some(v => {
      const st = ventState(v);
      if (!st.on) return false;
      const top = plumeTop(v, st);
      return [...hull, ...feet].some(([x, y]) => Math.abs(x - v.x) < 3.5 && y < top);
    });

    if (!hullHit && !footHit && !roofHit && !lavaHit && !rockHit) return;

    const pad = pads.find(p => feet.every(([x]) => x >= p.x1 && x <= p.x2));
    const angDeg = Math.abs(L.a * 180 / Math.PI);
    // on a moving pad, what counts is your speed relative to the deck

    const stats = { vy, vx, ang: angDeg };
    // just lifted off a pad and sank back onto it (low gravity makes this easy): settle again instead of crashing
    if (L.liftAt != null && simT - L.liftAt < 1.2 && pad && !hullHit && !roofHit && !lavaHit && !rockHit && vy <= safeVy() && vx <= safeVx()) {
      L.y += pad.y - Math.min(...feet.map(f => f[1]));
      L.vx = L.vy = 0; L.grounded = true;
      return;
    }

    if (!hullHit && !roofHit && !lavaHit && !rockHit && pad && vy <= safeVy() && vx <= safeVx() && angDeg <= safeAng()) {
      if (pad.move && pad.parkT == null) { pad.parkT = simT; updateMovers(); }   // the driver hits the brakes
      if (tut) { tutorialLanded(pad, vy, vx, angDeg); return; }
      if (mission) { missionTouchdown(pad, vy, vx, angDeg); return; }
      L.y += pad.y - Math.min(...feet.map(f => f[1]));
      L.vx = L.vy = 0; L.firing = false;
      // plant the flag beside the lander, on the pad when there's room
      const side = L.x + 5 <= pad.x2 - 0.5 ? 5 : L.x - 5 >= pad.x1 + 0.5 ? -5 : 5;
      flagPlant = { x: L.x + side, y: pad.move ? pad.y : groundAt(L.x + side), t: performance.now() };
      touchdownFx(vy, true);
      const base = 50 * pad.mult;
      const fuelBonus = Math.round(L.fuel * 2);
      const soft = vy < 0.8 ? 50 : 0;
      const pts = Math.round((base + fuelBonus + soft) * world.bonus);
      credits += pts;
      saveCosmetics();
      lastResult = { pad, pts, base, fuelBonus, soft, ...stats };
      lastRun = { frames: recording, result: 'landed' };
      sfx.thud(); sfx.landed(soft > 0);
      onLanded(pad, vy, vx, angDeg, L.fuel);
      noteLanding(pad, vy, pts);
      if (match) { endTurn(); return; }
      if (run) { runLanded(pts, pad); return; }
      score += pts;
      if (daily) {
        daily.results.push(lastResult);
        if (daily.site >= DAILY_SITES) award('perfect');

        return;
      }
      setMode('landed');
    } else {
      const reasons = [];
      if (hullHit && !footHit) reasons.push('hull struck terrain');
      if (lavaHit) reasons.push('caught in a volcanic eruption');
      if (rockHit) reasons.push('hit by a meteor');
      if (roofHit) reasons.push('scraped the rock overhead');
      const wet = waters.some(w => L.x > w.x1 && L.x < w.x2) && !pad;
      if (wet) reasons.push('splashed into the ocean');
      if (footHit && !pad && !wet) reasons.push('touched down off a pad');
      const rel = pad && pad.move ? ` relative to the ${pad.kind || 'rover'}` : '';
      if ((footHit || hullHit) && vy > safeVy()) reasons.push(`descending at ${vy.toFixed(1)} m/s${rel} (limit ${safeVy().toFixed(1)})`);
      if ((footHit || hullHit) && vx > safeVx()) reasons.push(`drifting at ${vx.toFixed(1)} m/s${rel} (limit ${safeVx()})`);
      if ((footHit || hullHit) && angDeg > safeAng()) reasons.push(`tilted ${angDeg.toFixed(0)}° (limit ${safeAng()}°)`);
      if (!reasons.length) reasons.push('hit the ground at a bad angle');
      crashCount++; store.set('ds-crashes', String(crashCount)); store.set('ds-lastCrash', String(Date.now()));
      if (!tut) logRepair({ world: world.name, pad: !hullHit && pad, roof: roofHit, lava: lavaHit, vy, vx, ang: angDeg, fuel: L.fuel });
      explode();
      addShake(14);
      holdCard = { dur: 1000, slow: false };
      lastResult = { reasons, pts: 0, ...stats };
      lastRun = { frames: recording, result: 'crashed' };
      sfx.boom();
      if (tut) { setMode('tutFail'); return; }
      if (mission) { mission.result = { ok: false }; setMode('missionEnd'); return; }
      if (match) { endTurn(); return; }
      if (daily) { daily.results.push(lastResult); setMode('dailyEnd'); return; }
      if (run) { runCrashed(); return; }
      lives--;
      setMode(lives > 0 ? 'crashed' : 'over');
    }
  }

  // ---- Endless run: one lander, random worlds, a perk from Gus after every landing ----
  // Fuel carries over between sites, and each landing refuels you a little (better pads pay more fuel).
  const PERKS = [
    { id: 'fuel', name: 'Spare canister', max: 99, desc: '+40 kg of fuel right now', gus: 'Found a spare canister behind the coffee machine. Don’t ask why it was there.', apply: r => { r.fuel = Math.min(r.maxFuel, r.fuel + 40); } },
    { id: 'tank', name: 'Bigger tank', max: 3, desc: '+25 kg tank size, and fill it up by 25', gus: 'Welded on a bigger tank. It’s a little lopsided. She’ll be fine.', apply: r => { r.maxFuel += 25; r.fuel += 25; } },
    { id: 'engine', name: 'Tuned engine', max: 3, desc: 'Main engine burns 10% less fuel', gus: 'Tuned the engine. She purrs. Apogee is jealous.' },
    { id: 'struts', name: 'Soft struts', max: 3, desc: '+0.3 m/s safe touchdown speed', gus: 'Softer struts! Land a little harder. Not a lot harder.' },
    { id: 'feet', name: 'Wide feet', max: 2, desc: '+0.4 m/s safe sideways drift', gus: 'Wider feet. She looks like she’s wearing snowshoes. Very stable snowshoes.' },
    { id: 'steady', name: 'Steady hands', max: 2, desc: '+4° safe tilt at touchdown', gus: 'Recalibrated the gyros. A little crooked is fine now. A little.' },
    { id: 'gyro', name: 'Free gyros', max: 1, desc: 'Turning costs no fuel, and turns 30% faster', gus: 'Free gyros! Spin all you like. Please don’t spin all you like.' },
    { id: 'shield', name: 'Wind shield', max: 1, desc: 'Wind pushes you half as hard', gus: 'Bolted on a wind shield. It’s a cookie sheet. It works.' },
    { id: 'radar', name: 'Landing radar', max: 1, desc: 'See where you’ll touch down, and how fast', gus: 'Radar online! The dotted line is your future. Make it a nice one.' },
    { id: 'refinery', name: 'Fuel refinery', max: 2, desc: '+50% fuel from every landing', gus: 'A tiny refinery! It makes fuel from moon dust. And hope.' },
    { id: 'spare', name: 'Spare lander', max: 1, desc: 'Survive one crash this run', gus: 'I built a spare Biscuit. Biscuit Two. Please don’t make me use it.', rare: true }
  ];
  const RUN_WORLDS = [['pluto', 'moon', 'titan', 'vesta', 'europa', 'ganymede'], ['io', 'mercury', 'mars'], ['earth', 'venus']];
  const REFUEL = { 2: 15, 3: 25, 4: 30, 5: 40 };
  const runBest = () => { try { return JSON.parse(store.get('ds-run-best', 'null')); } catch (e) { return null; } };
  function runPickWorld() {
    const tier = run.site <= 2 ? 1 : run.site <= 5 ? 2 : 3;
    const pool = RUN_WORLDS.slice(0, tier).flat().filter(id => id !== (world && world.id) || tier === 0);
    const id = pool[Math.floor(Math.random() * pool.length)];   // pick once, then look it up
    return WORLDS.find(w => w.id === id) || WORLDS[1];
  }
  function startRun() {
    match = null; daily = null; mission = null; tut = null; ghost = null; rng = Math.random;
    const t0 = Math.round(100 * ship().tank);
    run = { site: 1, score: 0, fuel: t0, maxFuel: t0, perks: {}, lives: 0, taken: [] };
    score = 0; lives = 1;
    runSite();
  }
  function runSite() {
    world = runPickWorld();
    level = run.site;
    genTerrain(); makeBackdrop();
    run.siteFuel = run.fuel;
    levelFuel = run.fuel;
    spawn();
    lander.fuelMax = run.maxFuel;
    fly(null);
    showToast(`Endless run · site ${run.site} · ${world.name}`, 1800);
  }
  function runLanded(pts, pad) {
    run.score += pts; score = run.score;
    const gain = Math.round((REFUEL[pad.mult] || 20) * (1 + 0.5 * perk('refinery')));
    run.refuel = gain;
    run.fuel = Math.min(run.maxFuel, lander.fuel + gain);
    run.lastPts = pts;
    // three different perks, skipping any that are maxed out; the spare lander is rare
    const open = PERKS.filter(x => (run.perks[x.id] || 0) < x.max && !(x.id === 'spare' && run.lives > 0) && (!x.rare || Math.random() < 0.35));
    run.offer = [];
    while (run.offer.length < 3 && open.length) run.offer.push(open.splice(Math.floor(Math.random() * open.length), 1)[0]);
    if (run.site >= 10) award('longhaul');
    setMode('runPerk');
  }

  }

  const replayBtn = () => lastRun && lastRun.frames && lastRun.frames.length > 20
    ? `<button class="btn ghost" id="replayBtn">${lastRun.result === 'crashed' ? 'Watch the crash' : 'Watch replay'}</button>` : '';
  function startReplay() {
    const fr = lastRun && lastRun.frames;
    if (!fr || fr.length < 20) return;
    const start = Math.max(0, fr.length - 60 * 5);
    replay = { fr, t: start, back: mode, done: false, endAt: 0, speed: 1,
      L: { x: fr[start][0], y: fr[start][1], a: fr[start][2], vx: 0, vy: 0, firing: false, cargo: lander.cargo, crew: lander.crew, cat: lander.cat } };
    particles = [];
    setMode('replay');
  }
  // Advances the replay; returns how fast the rest of the scene should run (slow motion near the end).
  function stepReplay(dt) {
    const r = replay, N = r.fr.length;
    r.speed = (N - r.t) / 60 > 1.6 ? 1 : 0.3;
    r.t += dt * 60 * r.speed;
    const i = Math.min(N - 1, Math.floor(r.t)), prev = r.fr[Math.max(0, i - 1)], [x, y, a, f] = r.fr[i];
    Object.assign(r.L, { x, y, a, vx: (x - prev[0]) * 60, vy: (y - prev[1]) * 60, firing: !r.done && f === 1, sling: r.fr[i].length > 4 ? { x: r.fr[i][4], y: r.fr[i][5] } : null });
    if (r.L.firing && Math.random() < 0.9 * r.speed + 0.1) emitExhaust(r.L);
    if (r.t >= N - 1 && !r.done) {
      r.done = true; r.L.firing = false;
      if (lastResult && lastResult.pad) { spawnDust(x, groundAt(x), 24, 1.2); sfx.thud(); }
      else if (lastRun.result === 'crashed') {
        for (let k = 0; k < 70; k++) {
          const ang = rand(0, Math.PI * 2), sp = rand(3, 20);
          particles.push({ x, y: y + 1, vx: Math.cos(ang) * sp, vy: Math.abs(Math.sin(ang)) * sp, g: Math.max(3, world.g * 2), life: rand(0.8, 2.2), max: 2.2, kind: 'blast' });
        }
        addShake(12); sfx.boom();
      }
      r.endAt = performance.now() + 1700;
    }
    if (r.done && performance.now() > r.endAt) endReplay();
    return r.speed;
  }
  function endReplay() {
    if (!replay) return;

    replay = null;

  }

  function logRepair(e) {
    const n = (+store.get('ds-repairs', '0') || 0) + (e.hard ? 0 : 1);
    store.set('ds-repairs', String(n));
    const pick = a => a[(n * 7 + a.length) % a.length];
    let text;
    if (e.hard) text = `Hard landing on ${e.world}, ${e.vy.toFixed(1)} m/s. Within limits. My heart was not.`;
    else if (e.lava) text = `Flew through an eruption on Io. Biscuit’s paint is now officially “toasted”. Smells like burnt marshmallow.`;
    else if (e.roof) text = `Hit the rock overhead. Antenna now points straight down. Biscuit can hear the ground really well now.`;
    else if (!e.pad) text = `Missed the pad and landed on a rock instead. The rock is fine. Named the new dent ${pick(DENTS)}.`;
    else if (e.ang > 10) text = `Came down tilted ${Math.round(e.ang)}°. Left leg bent again. I’ve started naming the dents. This one is ${pick(DENTS)}.`;
    else if (e.vy > 2) text = `Touched down at ${e.vy.toFixed(1)} m/s on ${e.world}. Struts compressed to roughly the thickness of a cracker. Biscuit says nothing, which is how I know she’s upset.`;
    else text = `Skidded sideways at ${e.vx.toFixed(1)} m/s across ${e.world}. Scraped the paint off one whole side. Ordered more paint. Ordered more patience.`;
    if (!e.hard && e.fuel <= 0) text += ' Also, the tank was empty. She was running on hope.';
    repairs.unshift({ n, t: Date.now(), world: e.world, hard: !!e.hard, text, parts: e.hard ? 'nothing, just a hug' : pick(PARTS) });

        const len = Math.max(1, Math.abs(windNow) * 1.2) * scale;
        ctx.fillRect(sx(d.x), sy(d.y), windNow >= 0 ? -len : len, Math.max(1, d.r * scale * 0.5));
      }
      ctx.globalAlpha = 1;
    }

    if (terrain.length) {
      ctx.beginPath();
      ctx.moveTo(sx(0), ch);
      for (const [x, y] of terrain) ctx.lineTo(sx(x), sy(y));
      ctx.lineTo(sx(W), ch); ctx.closePath();
      ctx.fillStyle = world.ground; ctx.fill();
      ctx.beginPath();
      terrain.forEach(([x, y], i) => i ? ctx.lineTo(sx(x), sy(y)) : ctx.moveTo(sx(x), sy(y)));
      ctx.strokeStyle = world.rim; ctx.lineWidth = 1.5; ctx.stroke();
      if (shades.length) drawShades();

      // rock overhangs, filled up past the top of the screen
      for (const c of ceilings) {
        ctx.beginPath();
        ctx.moveTo(sx(c[0][0]), -5);
        for (const [x, y] of c) ctx.lineTo(sx(x), sy(y));
        ctx.lineTo(sx(c[c.length - 1][0]), -5);
        ctx.closePath();
        ctx.fillStyle = world.ground; ctx.fill();
        ctx.strokeStyle = world.rim; ctx.lineWidth = 1.5; ctx.stroke();
      }

      if (waters.length) drawWater(time);
      for (const p of pads) if (p.move) drawMover(p, time);
      ctx.font = `600 ${Math.min(16, Math.max(10, base * 3.2 * Math.sqrt(cam.z)))}px ${C('--f-mono')}`;
      ctx.textAlign = 'center';
      for (const p of pads) {
        const lit = !mission || isGoalPad(p);
        ctx.globalAlpha = !lit ? 0.4 : mission ? 0.75 + 0.25 * Math.sin(time / 200) : 1;
        ctx.strokeStyle = col.flame; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(sx(p.x1), sy(p.y)); ctx.lineTo(sx(p.x2), sy(p.y)); ctx.stroke();
        ctx.fillStyle = col.flame;
        const off = Math.min(24, Math.max(14, base * 4.5 * Math.sqrt(cam.z)));
        ctx.fillText(p.label || `×${p.mult}`, sx((p.x1 + p.x2) / 2), p.move ? sy(p.y) - off * 0.55 - 4.5 * scale : sy(p.y) + off);
        ctx.globalAlpha = 1;
      }
      if (mission) drawMissionProps(time);
      if (vents.length) drawVents(time);
      if (meteors.length && (mode === 'flying' || mode === 'paused')) drawMeteors(time);
    }

    const sk = skin();
    for (const p of particles) {
      const k = Math.max(0, p.life / p.max);
      ctx.globalAlpha = Math.min(1, k * 1.6);
      if (p.kind === 'fire') {
        const [core, tail] = flameColors(sk.flame, time / 1000, p.hue);
        ctx.fillStyle = k > 0.5 ? core : tail;
      } else if (p.kind === 'dust') {
        ctx.globalAlpha = Math.min(0.5, k * 0.7);
        ctx.fillStyle = world.rim;
        const r = (0.5 + (1 - k) * 1.1) * scale;
        ctx.fillRect(sx(p.x) - r / 2, sy(p.y) - r / 2, r, r);
        continue;
      } else {
        ctx.fillStyle = p.kind === 'blast' ? (k > 0.5 ? col.flame : col.bad) : col.reg;
      }
      const r = (p.kind !== 'debris' ? 0.5 + k * 0.6 : 0.6) * scale;
      ctx.fillRect(sx(p.x) - r / 2, sy(p.y) - r / 2, r, r);
    }
    ctx.globalAlpha = 1;

    if (ghost && showGhost && (mode === 'flying' || mode === 'paused')) drawGhost(time);
    const sitting = lastResult && lastResult.pad && (mode === 'landed' || mode === 'turn' || mode === 'roundEnd' || mode === 'matchEnd' || mode === 'dailyEnd' || mode === 'missionEnd' || mode === 'tutDone' || mode === 'touchdown');
    if (sitting && flagPlant) drawFlag(time);
    if ((mode === 'flying' || mode === 'paused') && (upgLevel('radar') || perk('radar')) && lander) drawRadar(time);
    if (mode === 'flying' || mode === 'paused' || sitting) drawLander(lander, time);
    if (mode === 'replay' && replay) drawLander(replay.L, time);
    if (mode === 'setup' || mode === 'settings') drawLander({ x: W / 2, y: H * 0.62, a: Math.sin(time / 1400) * 0.15, firing: true }, time);
    if (world.fog && lander && !MENU_MODES.includes(mode)) drawFog(mode === 'replay' && replay ? replay.L : lander);
    if (mission && mission.def.rings && !MENU_MODES.includes(mode)) drawRings(time);
    if (world.hazard === 'storm' && (mode === 'flying' || mode === 'paused') && stormState().on) drawStatic();
    if (shaking) ctx.restore();
    if (mode === 'replay' && replay) {
      // cinematic bars
      const bh = Math.round(ch * 0.09);
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cw, bh); ctx.fillRect(0, ch - bh, cw, bh);
      ctx.font = `600 13px ${C('--f-mono')}`;
      ctx.textAlign = 'left'; ctx.fillStyle = col.flame; ctx.fillText('● REPLAY', 16, bh / 2 + 5);
      ctx.textAlign = 'right'; ctx.fillStyle = col.reg;
      ctx.fillText(replay.speed < 1 ? 'SLOW MOTION · TAP TO SKIP' : 'TAP TO SKIP', cw - 16, bh / 2 + 5);
    }
  }

  // Draws the lander in its own coordinates (metres, y pointing down), using the given skin.
  function paintLander(c, L, sk, time, lw) {
    const hull = sk.hull;
    c.lineWidth = lw;
    c.lineJoin = 'round';
    if (L.firing) {
      let len = 3 + Math.random() * 2.5;
      if (sk.flame.pulse) len *= 0.65 + 0.55 * Math.abs(Math.sin(time / 110));
      const [core, tail] = flameColors(sk.flame, time / 1000);
      c.beginPath(); c.moveTo(-1, 1.3); c.lineTo(0, 1.3 + len); c.lineTo(1, 1.3); c.closePath();
      c.fillStyle = tail; c.fill();
      c.beginPath(); c.moveTo(-0.55, 1.3); c.lineTo(0, 1.3 + len * 0.6); c.lineTo(0.55, 1.3); c.closePath();
      c.fillStyle = core; c.fill();
    }
    let fill = hull.fill;
    if (hull.chrome) {
      const o = (time / 2600) % 1;
      const g = c.createLinearGradient(-3, -4, 3, 1);
      g.addColorStop(0, '#4a5568');
      g.addColorStop(Math.max(0, o - 0.18), '#8a97ad');
      g.addColorStop(o, '#ffffff');
      g.addColorStop(Math.min(1, o + 0.18), '#8a97ad');

      fill = g;
    }
    c.fillStyle = fill;
    c.strokeStyle = hull.stroke;
    const model = L.model || sk.model || 'biscuit';
    if (model === 'apex') {
      // Apex Vector: a pointed racing cabin, tail fins, a thin deck and swept legs
      c.beginPath();
      c.moveTo(-1.6, -0.5); c.lineTo(-1.3, -2.7); c.lineTo(0, -4.6); c.lineTo(1.3, -2.7); c.lineTo(1.6, -0.5); c.closePath();
      c.fill(); c.stroke();
      for (const s of [-1, 1]) { c.beginPath(); c.moveTo(s * 1.5, -1.6); c.lineTo(s * 2.7, -0.4); c.lineTo(s * 1.6, -0.5); c.closePath(); c.fill(); c.stroke(); }
      c.strokeStyle = hull.detail;
      c.beginPath(); c.moveTo(-0.6, -3.1); c.lineTo(0, -3.8); c.lineTo(0.6, -3.1); c.stroke();
      c.beginPath(); c.moveTo(0, -2.6); c.lineTo(0, -0.7); c.stroke();
      c.strokeStyle = hull.stroke;
      c.fillRect(-2.3, -0.5, 4.6, 1.1); c.strokeRect(-2.3, -0.5, 4.6, 1.1);
      c.strokeStyle = hull.legs;
      c.beginPath(); c.moveTo(-0.6, 0.6); c.lineTo(-0.9, 1.3); c.lineTo(0.9, 1.3); c.lineTo(0.6, 0.6); c.stroke();
      for (const s of [-1, 1]) {
        c.beginPath();
        c.moveTo(s * 1.6, 0.6); c.lineTo(s * 3.4, 3);
        c.moveTo(s * 2.9, 3); c.lineTo(s * 3.9, 3);
        c.stroke();
      }
    } else if (model === 'workhorse') {
      // Workhorse: a cab set to one side of a long flat cargo deck, a little crane arm, and four stout legs
      c.beginPath();
      c.moveTo(-2.6, -0.5); c.lineTo(-2.6, -3.3); c.lineTo(-0.2, -3.3); c.lineTo(0.4, -2.2); c.lineTo(0.4, -0.5); c.closePath();
      c.fill(); c.stroke();
      c.strokeStyle = hull.detail;
      c.strokeRect(-2.1, -2.8, 1.6, 0.9);
      c.beginPath(); c.moveTo(0.4, -1.4); c.lineTo(2.6, -3.4); c.lineTo(2.6, -2.2); c.stroke();
      c.strokeStyle = hull.stroke;
      c.fillRect(-3.1, -0.5, 6.2, 1.4); c.strokeRect(-3.1, -0.5, 6.2, 1.4);
      c.fillRect(0.9, -1.4, 1.5, 0.9); c.strokeRect(0.9, -1.4, 1.5, 0.9);
      c.strokeStyle = hull.legs;
      c.beginPath(); c.moveTo(-0.7, 0.9); c.lineTo(-1, 1.4); c.lineTo(1, 1.4); c.lineTo(0.7, 0.9); c.stroke();
      for (const s of [-1, 1]) {
        c.beginPath();
        c.moveTo(s * 2.8, 0.9); c.lineTo(s * 3.5, 3);
        c.moveTo(s * 1.8, 0.9); c.lineTo(s * 2.4, 3);
        c.moveTo(s * 2.0, 3); c.lineTo(s * 4.0, 3);
        c.stroke();
      }
    } else if (model === 'whisker') {
      // Whisker: a small round cabin with cat ears, a curly tail antenna and springy legs
      c.beginPath(); c.arc(0, -2.2, 1.7, Math.PI * 0.95, Math.PI * 2.05); c.lineTo(1.7, -0.5); c.lineTo(-1.7, -0.5); c.closePath();
      c.fill(); c.stroke();
      for (const s of [-1, 1]) { c.beginPath(); c.moveTo(s * 0.7, -3.7); c.lineTo(s * 1.3, -4.7); c.lineTo(s * 1.55, -3.2); c.closePath(); c.fill(); c.stroke(); }
      c.strokeStyle = hull.detail;
      c.beginPath(); c.arc(-0.6, -2.3, 0.3, 0, Math.PI * 2); c.stroke(); c.beginPath(); c.arc(0.6, -2.3, 0.3, 0, Math.PI * 2); c.stroke();
      c.beginPath(); c.moveTo(1.6, -1.3); c.quadraticCurveTo(3, -1.6, 2.6, -3); c.stroke();
      c.strokeStyle = hull.stroke;
      c.fillRect(-2.1, -0.5, 4.2, 1.2); c.strokeRect(-2.1, -0.5, 4.2, 1.2);
      c.strokeStyle = hull.legs;
      c.beginPath(); c.moveTo(-0.5, 0.7); c.lineTo(-0.7, 1.1); c.lineTo(0.7, 1.1); c.lineTo(0.5, 0.7); c.stroke();
      for (const s of [-1, 1]) {
        c.beginPath();
        c.moveTo(s * 1.6, 0.7); c.lineTo(s * 2.4, 1.5); c.lineTo(s * 2.1, 2.2); c.lineTo(s * 3.2, 3);
        c.moveTo(s * 2.7, 3); c.lineTo(s * 3.8, 3);
        c.stroke();
      }
    } else if (model === 'lark') {
      // Lark: a boxy cabin with a dish on top, side tanks, a wide deck and sturdy double legs
      c.beginPath();
      c.moveTo(-2.3, -0.5); c.lineTo(-2.3, -2.9); c.lineTo(-1.5, -3.5); c.lineTo(1.5, -3.5); c.lineTo(2.3, -2.9); c.lineTo(2.3, -0.5); c.closePath();
      c.fill(); c.stroke();
      c.strokeStyle = hull.detail;
      c.strokeRect(-1.4, -3, 1.1, 0.9); c.strokeRect(0.3, -3, 1.1, 0.9);
      c.beginPath(); c.moveTo(0, -3.5); c.lineTo(0, -4.2); c.stroke();
      c.beginPath(); c.arc(0.6, -4.3, 0.55, Math.PI * 0.9, Math.PI * 1.9); c.stroke();
      c.strokeStyle = hull.stroke;
      c.fillRect(-2.9, -0.5, 5.8, 1.7); c.strokeRect(-2.9, -0.5, 5.8, 1.7);
      for (const s of [-1, 1]) { c.beginPath(); c.arc(s * 3.2, 0.3, 0.75, 0, Math.PI * 2); c.fill(); c.stroke(); }
      c.strokeStyle = hull.legs;
      c.beginPath(); c.moveTo(-0.7, 1.2); c.lineTo(-1, 1.6); c.lineTo(1, 1.6); c.lineTo(0.7, 1.2); c.stroke();
      for (const s of [-1, 1]) {
        c.beginPath();
        c.moveTo(s * 2.5, 1.2); c.lineTo(s * 3.4, 3);
        c.moveTo(s * 1.6, 1.2); c.lineTo(s * 3.4, 3);
        c.moveTo(s * 3.2, 1); c.lineTo(s * 3.6, 3);
        c.moveTo(s * 2.7, 3); c.lineTo(s * 4.2, 3);
        c.stroke();
      }
    } else {
      // Biscuit: the classic two-stage lander
      c.beginPath();
      c.moveTo(-1.8, -0.5); c.lineTo(-2.2, -2.6); c.lineTo(-1, -3.8); c.lineTo(1, -3.8);
      c.lineTo(2.2, -2.6); c.lineTo(1.8, -0.5); c.closePath();
      c.fill(); c.stroke();
      c.strokeStyle = hull.detail;
      c.beginPath(); c.moveTo(-0.9, -2.9); c.lineTo(0, -3.3); c.lineTo(0.9, -2.9); c.stroke();
      c.strokeStyle = hull.stroke;
      c.fillRect(-2.6, -0.5, 5.2, 1.5); c.strokeRect(-2.6, -0.5, 5.2, 1.5);
      c.strokeStyle = hull.legs;
      c.beginPath(); c.moveTo(-0.6, 1); c.lineTo(-0.9, 1.4); c.lineTo(0.9, 1.4); c.lineTo(0.6, 1); c.stroke();
      for (const s of [-1, 1]) {
        c.beginPath();
        c.moveTo(s * 2.2, 0.8); c.lineTo(s * 3.4, 3);
        c.moveTo(s * 1.4, 1); c.lineTo(s * 3.4, 3);
        c.moveTo(s * 2.8, 3); c.lineTo(s * 4, 3);
        c.stroke();
      }
    }
    if (L.cargo) {
      c.fillStyle = '#b07a35'; c.strokeStyle = '#ffd9a0';
      c.fillRect(-1.3, -5.6, 2.6, 1.7); c.strokeRect(-1.3, -5.6, 2.6, 1.7);
      c.beginPath(); c.moveTo(-1.3, -5.6); c.lineTo(1.3, -3.9); c.moveTo(1.3, -5.6); c.lineTo(-1.3, -3.9); c.stroke();
    }
    if (L.crew) {
      c.fillStyle = Math.floor(time / 300) % 2 ? '#9fe0b8' : '#2f7a55';
      c.beginPath(); c.arc(0, -4.4, 0.5, 0, Math.PI * 2); c.fill();
    }
    if (L.cat) {
      // Apogee, peeking out of the hatch
      c.fillStyle = '#ff9a3d';
      c.beginPath(); c.arc(0, -4.35, 0.62, 0, Math.PI * 2); c.fill();
      c.beginPath(); c.moveTo(-0.6, -4.55); c.lineTo(-0.48, -5.35); c.lineTo(-0.08, -4.9); c.closePath(); c.fill();
      c.beginPath(); c.moveTo(0.6, -4.55); c.lineTo(0.48, -5.35); c.lineTo(0.08, -4.9); c.closePath(); c.fill();
      c.fillStyle = '#15151f';
      c.fillRect(-0.32, -4.5, 0.16, 0.16); c.fillRect(0.16, -4.5, 0.16, 0.16);
    }
  }

  function drawGhost(time) {
    const fr = ghost.frames;
    if (!fr || !fr.length) return;
    const at = Math.floor(flightT * 60), done = at >= fr.length;
    const [x, y, a, f] = fr[Math.min(fr.length - 1, at)];
    ctx.save();
    if (done && ghost.result === 'crashed') {
      // mark where the ghost went down
      ctx.globalAlpha = 0.7; ctx.strokeStyle = ghost.tint; ctx.lineWidth = 2;
      const X = sx(x), Y = sy(y), r = Math.max(5, scale * 2);
      ctx.beginPath(); ctx.moveTo(X - r, Y - r); ctx.lineTo(X + r, Y + r); ctx.moveTo(X + r, Y - r); ctx.lineTo(X - r, Y + r); ctx.stroke();
    } else {
      ctx.globalAlpha = 0.45;
      ctx.translate(sx(x), sy(y)); ctx.rotate(a); ctx.scale(scale, scale);
      paintLander(ctx, { firing: !done && f === 1 }, ghostSkin(ghost.tint), time, 1.6 / scale);
    }
    ctx.restore();
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = ghost.tint;
    ctx.font = `500 11px ${C('--f-mono')}`;
    ctx.textAlign = 'center';
    ctx.fillText(String(ghost.label).toUpperCase(), sx(x), sy(y + 5) - 4);
    ctx.globalAlpha = 1;
  }

  function starPath(c, cx, cy, r) {
    c.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.42 : r;
      c.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
    }
    c.closePath();
  }
  // Draws a flag with its pole foot at the origin (metres, y down). prog 0→1 raises the pole, then unfurls the cloth.
  function paintFlag(c, f, time, prog, lw) {
    if (!f || prog <= 0) return;
    const poleH = 6 * Math.min(1, prog / 0.55);
    c.lineCap = 'round';
    c.strokeStyle = '#c9cfdc'; c.lineWidth = lw;
    c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -poleH); c.stroke();
    const u = Math.max(0, Math.min(1, (prog - 0.55) / 0.45));
    if (!u) return;
    const fw = 3.6 * u, fh = 2.3, top = -6;
    const [c0, c1, c2] = f.colors;
    if (f.style === 'pennant') {
      c.beginPath(); c.moveTo(0, top); c.lineTo(fw, top + fh / 2); c.lineTo(0, top + fh); c.closePath();
      c.fillStyle = c0; c.fill();
    } else if (f.style === 'stripes') {
      [c0, c1, c2].forEach((col, i) => { c.fillStyle = col; c.fillRect(0, top + i * fh / 3, fw, fh / 3 + 0.02); });
    } else if (f.style === 'star') {
      c.fillStyle = c0; c.fillRect(0, top, fw, fh);
      c.fillStyle = c1; starPath(c, fw / 2, top + fh / 2, 0.75 * u); c.fill();
    } else if (f.style === 'checker') {
      const cols = 6, rows = 4;
      for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
        c.fillStyle = (i + j) % 2 ? c1 : c0;
        c.fillRect(i * fw / cols, top + j * fh / rows, fw / cols + 0.02, fh / rows + 0.02);
      }
    } else if (f.style === 'skull') {
      c.fillStyle = c0; c.fillRect(0, top, fw, fh);
      c.fillStyle = c1; c.strokeStyle = c1; c.lineWidth = lw * 1.3;
      c.beginPath(); c.arc(fw / 2, top + fh * 0.38, 0.5 * u, 0, Math.PI * 2); c.fill();
      c.beginPath();
      c.moveTo(fw / 2 - 0.8 * u, top + fh * 0.62); c.lineTo(fw / 2 + 0.8 * u, top + fh * 0.88);
      c.moveTo(fw / 2 + 0.8 * u, top + fh * 0.62); c.lineTo(fw / 2 - 0.8 * u, top + fh * 0.88);
      c.stroke();
    } else if (f.style === 'paw') {
      c.fillStyle = c0; c.fillRect(0, top, fw, fh);
      c.fillStyle = c1;
      const cx = fw / 2, cy = top + fh * 0.64;
      c.beginPath(); c.ellipse(cx, cy, 0.48 * u, 0.36 * u, 0, 0, Math.PI * 2); c.fill();
      for (const [dx, dy] of [[-0.58, -0.42], [-0.21, -0.7], [0.21, -0.7], [0.58, -0.42]]) {
        c.beginPath(); c.arc(cx + dx * u, cy + dy, 0.17 * u, 0, Math.PI * 2); c.fill();
      }
    } else if (f.style === 'wave') {
      const g = c.createLinearGradient(0, 0, fw, 0);
      g.addColorStop(0, c0); g.addColorStop(1, c1);
      c.fillStyle = g;
      const n = 14;
      for (let i = 0; i < n; i++) {
        const k = i / n, off = Math.sin(time / 240 - i * 0.7) * 0.32 * k;
        c.fillRect(k * fw, top + off, fw / n + 0.1, fh);
      }
    }
  }
  function drawVents(time) {
    const lava = world.hazard === 'volcano';
    for (const v of vents) {
      const st = ventState(v), gy = groundAt(v.x);
      ctx.fillStyle = lava ? '#ff6a2a' : '#bfe3ff';
      ctx.globalAlpha = st.warn ? 0.35 + 0.65 * Math.abs(Math.sin(time / 90)) : st.on ? 1 : 0.3;
      ctx.beginPath(); ctx.ellipse(sx(v.x), sy(gy), 2.2 * scale, 0.7 * scale, 0, 0, Math.PI * 2); ctx.fill();
      if (st.on) {
        const hgt = plumeTop(v, st) - gy, r = (lava ? 0.7 : 1.1) * scale;
        for (let i = 0; i < 46; i++) {
          const f = Math.random(), spread = 1.2 + f * 2.4;
          ctx.globalAlpha = (lava ? 0.9 : 0.5) * (1 - f * 0.6);
          ctx.fillStyle = lava ? (Math.random() < 0.5 ? '#ffd23f' : '#ff5a1f') : '#e8f6ff';
          ctx.fillRect(sx(v.x + (Math.random() * 2 - 1) * spread) - r / 2, sy(gy + f * hgt) - r / 2, r, r);
        }
      }
    }
    ctx.globalAlpha = 1;
  }
  // Venus: clouds hide everything beyond a short radius around the lander; pad beacons show through.
  // Landing radar: where you'd come down if you let go of the engine now, and how fast
  function drawRadar(time) {
    const L = lander;
    let x = L.x, y = L.y - 3, vx = L.vx, vy = L.vy;
    const dt = 0.08, pts = [];
    let hit = null;
    for (let i = 0; i < 300; i++) {
      vx += (windNow - world.drag * vx) * dt; vy += (-world.g - world.drag * vy) * dt;
      x += vx * dt; y += vy * dt;
      if (x < 0 || x > W) break;
      const sfc = surfaceAt(x);
      if (y <= sfc) { hit = { x, y: sfc, vy: -vy, vx: Math.abs(vx) }; break; }
      if (i % 3 === 0) pts.push([x, y]);
    }
    ctx.save();
    ctx.fillStyle = 'rgba(159, 224, 184, 0.55)';

  // ---- HUD ----

  // ---- Loop ----
  let last = performance.now(), acc = 0;

    }

      bright: world.drag > 0 ? 1100 : 420   // muffled in a vacuum, brighter where there's air
    });

    draw(now);

  const ADVANCES = ['runSpare', 'runEnd', 'setup', 'brief', 'landed', 'crashed', 'over', 'turn', 'roundEnd', 'matchEnd', 'dailyEnd', 'missionEnd', 'paused', 'tutDone', 'tutFail'];
  addEventListener('keydown', e => {
    if (e.target instanceof HTMLInputElement || e.target instanceof HTMLTextAreaElement) {
      if (e.code === 'Enter') e.target.blur();
      return;
    }
    const k = keyMap[e.code];
    if (mode === 'replay') { e.preventDefault(); endReplay(); return; }
    if (mode === 'story') {
      if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (!e.repeat) storyNext(); }
      else if (e.code === 'Escape') storyEnd();
      return;
    }
    if (mode === 'brief' && e.code === 'Escape') { setMode('missions'); return; }
    if (mode === 'board' || mode === 'album' || mode === 'log') { if (e.code === 'Escape') setMode('lounge'); return; }
    if (mode === 'hangar' || mode === 'badges' || mode === 'missions' || mode === 'settings' || mode === 'lounge' || (mode === 'setup' && e.code === 'Escape')) {
      if (e.code === 'Escape') { trying = null; setMode('title'); }
      return;
    }
    if ((e.code === 'KeyP' || e.code === 'Escape') && !e.repeat) {
      if (mode === 'flying') { setMode('paused'); e.preventDefault(); return; }
      if (mode === 'paused') { setMode('flying'); e.preventDefault(); return; }
    }
    if ((mode === 'title' || mode === 'over') && e.code === 'KeyB' && !e.repeat) { setMode('badges'); return; }
    if ((mode === 'title' || mode === 'over') && e.code === 'KeyH' && !e.repeat) { setMode('hangar'); return; }
    if (mode === 'title' && e.code === 'KeyR' && !e.repeat) { setMode('lounge'); return; }
    if (mode === 'setup' && playMode !== 'daily' && (k === 'left' || k === 'right')) {
      e.preventDefault();
      if (e.repeat) return;
      const i = WORLDS.indexOf(world) + (k === 'left' ? -1 : 1);
      selectWorld(WORLDS[(i + WORLDS.length) % WORLDS.length]);
      return;
    }
    if (e.code === 'KeyM' && !e.repeat) { toggleMute(); return; }
    if (e.code === 'KeyN' && !e.repeat) { toggleMusic(); return; }
    if (e.code === 'KeyG' && !e.repeat) {
      showGhost = !showGhost;
      store.set('ds-ghost', showGhost ? '1' : '0');
      showToast(`Ghost ${showGhost ? 'on' : 'off'}`);
      if (mode === 'settings') renderSettings();
      return;
    }
    if (e.code === 'KeyZ' && !e.repeat) {
      autoZoom = !autoZoom;
      store.set('ds-zoom', autoZoom ? '1' : '0');
      showToast(`Auto-zoom ${autoZoom ? 'on' : 'off'}`);
      if (mode === 'settings') renderSettings();
      return;
    }
    if (k) { keys[k] = mode === 'flying'; e.preventDefault(); }
    else if (e.code === 'Space' && ADVANCES.includes(mode)) { e.preventDefault(); advance(); }
    else if (e.code === 'Enter' && ADVANCES.includes(mode) && !document.activeElement.classList.contains('world')) { e.preventDefault(); advance(); }
    else if (e.code === 'Space') e.preventDefault();
  });
  addEventListener('keyup', e => { const k = keyMap[e.code]; if (k) keys[k] = false; });
  // auto-pause when the player looks away
  addEventListener('blur', () => { keys.left = keys.right = keys.thrust = false; if (mode === 'flying') setMode('paused'); });

  [['bl', 'left'], ['bt', 'thrust'], ['br', 'right']].forEach(([id, k]) => {
    const b = $(id);
    const on = e => { e.preventDefault(); if (mode !== 'flying') return; keys[k] = true; b.classList.add('held'); try { b.setPointerCapture(e.pointerId); } catch (_) {} };
    const off = () => { keys[k] = false; b.classList.remove('held'); };
    b.addEventListener('pointerdown', on);
    b.addEventListener('pointerup', off);
    b.addEventListener('pointercancel', off);
    b.addEventListener('lostpointercapture', off);
    b.addEventListener('contextmenu', e => e.preventDefault());
  });

  // Browsers only allow audio after the player interacts, so start it on the first key or tap.
  // iPhones only allow it when a tap ends (touchend/click), not when it starts, so listen for all of them.
  for (const type of ['pointerdown', 'touchend', 'click', 'keydown']) addEventListener(type, () => sfx.unlock(), { capture: true });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { sfx.suspend(); if (mode === 'flying') setMode('paused'); }
    else sfx.unlock();
  });
  stage.addEventListener('pointerdown', () => { if (mode === 'replay') endReplay(); });
  $('pauseBtn').addEventListener('click', () => { if (mode === 'flying') setMode('paused'); });
  const muteBtn = $('mute');
  function syncMute() {
    muteBtn.textContent = sfx.muted ? 'Sound off' : 'Sound on';
    muteBtn.setAttribute('aria-pressed', String(sfx.muted));
  }
  function toggleMusic() {
    sfx.setMusic(!sfx.musicOn);
    showToast(sfx.musicOn ? 'Music on' : 'Music off');
    if (mode === 'settings') renderSettings('setMusic');
  }
  function toggleMute() {
    sfx.setMuted(!sfx.muted);
    syncMute();
    showToast(sfx.muted ? 'Sound off' : 'Sound on');
    if (mode === 'settings') renderSettings('setSound');
  }
  muteBtn.addEventListener('click', toggleMute);
  syncMute();

  new ResizeObserver(resize).observe(stage);
  resize();
  genTerrain();
  spawn();
  setMode('title');
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
